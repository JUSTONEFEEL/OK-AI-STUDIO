<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>AI对话 — OK AI ART</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-primary: var(--color-primary);
      --color-secondary: var(--color-secondary);
    }
    @layer base {
      body { background: var(--surface-bg); color: var(--text-body); }
      td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
      th { @apply whitespace-nowrap; }
    }
  </style>
  <style>
    .chat-message-user { margin-left: auto; }
    .chat-message-ai { margin-right: auto; }
    .chat-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-light); }
    .conversation-item:hover { background-color: var(--surface-hover); }
    .conversation-item.active { background-color: var(--color-primary-light); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message-content { white-space: pre-wrap; word-break: break-word; }
    .typing-indicator span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      margin: 0 2px;
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .api-setup-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased" data-page="chat" style="font-family: var(--font-body); color: var(--text-body); background-color: var(--surface-bg);">

<!-- Mobile drawer backdrop -->
<div id="app-backdrop" class="app-backdrop"></div>

<!-- ===== LEFT SIDEBAR ===== -->
<aside id="app-sidebar"
  class="app-sidebar fixed top-0 left-0 z-30 flex flex-col h-screen border-r"
  style="width: var(--sidebar-width); background-color: var(--surface-inset); border-color: var(--border-default);">
  <!-- Sidebar Logo / Brand -->
  <div class="flex items-center gap-3 px-5 h-16 border-b" style="border-color: var(--border-default);">
    <div class="flex items-center justify-center flex-shrink-0"
      style="width: 32px; height: 32px; background-color: var(--color-primary); border-radius: var(--radius-md);">
      <img src="assets/logo.svg" alt="OK AI ART" style="width: 20px; height: 20px;" />
    </div>
    <span class="text-sm font-semibold tracking-tight" style="font-family: var(--font-heading); color: var(--text-heading);">OK AI ART</span>
  </div>

  <!-- Sidebar Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 px-3">
    <ul class="flex flex-col gap-1" style="list-style: none; margin: 0; padding: 0;">
      <li>
        <a href="index.html" data-nav-key="dashboard"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>工作台</span>
        </a>
      </li>
      <li>
        <a href="ai-employees.html" data-nav-key="ai-employees"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>AI员工</span>
        </a>
      </li>
      <li>
        <a href="news-hub.html" data-nav-key="news-hub"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
          <span>资讯台</span>
        </a>
      </li>
      <!-- AI Chat -->
      <li>
        <a href="chat.html" data-nav-key="chat" data-active="true"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>AI对话</span>
        </a>
      </li>
      <li>
        <a href="creative-studio.html" data-nav-key="creative-studio"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
          <span>创作工坊</span>
        </a>
      </li>
      <li>
        <a href="projects.html" data-nav-key="projects"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg>
          <span>项目中心</span>
        </a>
      </li>
      <li>
        <a href="resources.html" data-nav-key="resources"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
          <span>资源库</span>
        </a>
      </li>
      <li>
        <a href="settings.html" data-nav-key="settings"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>设置</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="px-4 py-4 border-t" style="border-color: var(--border-default);">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center flex-shrink-0 text-xs font-semibold"
        style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading);">U</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium truncate" style="font-family: var(--font-heading); color: var(--text-heading);">创作者</p>
        <p class="text-xs truncate" style="color: var(--text-muted);">专业版</p>
      </div>
    </div>
  </div>
</aside>

<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">

  <!-- ===== TOP HEADER BAR ===== -->
  <header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6 border-b gap-3"
    style="background-color: var(--surface-card); border-color: var(--border-default);">
    <!-- Header Left: hamburger (mobile) + Page Title -->
    <div class="flex items-center gap-3 min-w-0">
      <button id="menu-toggle" class="menu-toggle items-center justify-center p-2 rounded-md" style="color: var(--text-secondary); display:none;" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="header-page-title text-lg font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">AI对话</h1>
    </div>

    <!-- Header Center: Search -->
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" data-role="search" placeholder="搜索对话..."
          class="w-full pl-9 pr-4 py-2 text-sm rounded-md outline-none transition-colors duration-150"
          style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);"
          onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'"
          onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
      </div>
    </div>

    <!-- Header Right: theme toggle + notifications + avatar -->
    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题">
        <svg data-theme-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg data-theme-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <div class="relative">
        <button id="notif-btn" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="通知">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute top-1.5 right-1.5" style="width: 7px; height: 7px; background-color: var(--color-primary); border-radius: var(--radius-full);"></span>
        </button>
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-item">
            <div style="width:8px;height:8px;border-radius:9999px;background:var(--color-primary);margin-top:6px;flex-shrink:0;"></div>
            <div>
              <p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">新任务分配</p>
              <p class="text-xs mt-0.5" style="color:var(--text-muted);">Lucy 完成了第 4 集剧本 · 2 分钟前</p>
            </div>
          </div>
        </div>
      </div>
      <button class="flex items-center justify-center flex-shrink-0" style="width: 34px; height: 34px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 13px; font-weight: 600; transition: background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--color-primary)'; this.style.color='var(--text-inverse)'" onmouseout="this.style.backgroundColor='var(--color-primary-light)'; this.style.color='var(--color-primary)'" aria-label="用户菜单">U</button>
    </div>
  </header>

  <!-- ===== PAGE CONTENT AREA ===== -->
  <main class="flex-1 overflow-hidden flex" style="background-color: var(--surface-bg);">

    <!-- 左侧：对话历史列表 -->
    <aside class="w-72 flex-shrink-0 border-r flex flex-col" style="background-color: var(--surface-card); border-color: var(--border-default);">
      <div class="p-4 border-b" style="border-color: var(--border-default);">
        <button id="new-chat-btn" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-md text-sm font-semibold transition-all duration-150"
          style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse);"
          onmouseover="this.style.backgroundColor='var(--color-primary-hover)'"
          onmouseout="this.style.backgroundColor='var(--color-primary)'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建对话
        </button>
      </div>
      <div id="conversation-list" class="flex-1 overflow-y-auto p-2">
        <div class="flex flex-col items-center justify-center h-full py-12 text-center">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-bottom: 12px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <p class="text-sm" style="color: var(--text-muted);">暂无对话历史</p>
          <p class="text-xs mt-1" style="color: var(--text-muted);">点击上方按钮开始新对话</p>
        </div>
      </div>
    </aside>

    <!-- 右侧：聊天界面 -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- 顶部：模型选择 -->
      <div class="px-6 py-3 border-b flex items-center gap-4" style="border-color: var(--border-default); background-color: var(--surface-card);">
        <label class="text-sm font-medium" style="font-family: var(--font-heading); color: var(--text-secondary);">模型：</label>
        <select id="model-select" class="px-3 py-1.5 rounded-md text-sm cursor-pointer transition-colors duration-150"
          style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);"
          onfocus="this.style.borderColor='var(--color-primary)'"
          onblur="this.style.borderColor='var(--border-default)'">
          <option value="gpt-5.4-nano">加载中...</option>
        </select>
        <div id="current-conversation-title" class="ml-auto text-sm truncate" style="color: var(--text-muted);"></div>
      </div>

      <!-- 中间：消息列表 -->
      <div id="message-container" class="flex-1 overflow-y-auto p-6">
        <!-- AI未配置引导 -->
        <div id="api-setup-state" class="api-setup-card" style="display: none;">
          <div class="w-20 h-20 rounded-full flex items-center justify-center mb-6" style="background-color: var(--state-warning); opacity: 0.1;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--state-warning);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
          <h3 class="text-xl font-semibold mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">需要配置 API Key</h3>
          <p class="text-sm mb-6 max-w-md" style="color: var(--text-muted);">请先在设置页面配置您的 API Key，然后才能开始使用 AI 对话功能。</p>
          <a href="settings.html" class="inline-flex items-center justify-center gap-2 px-6 py-2.5 rounded-md text-sm font-semibold transition-all duration-150"
            style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); text-decoration: none;"
            onmouseover="this.style.backgroundColor='var(--color-primary-hover)'"
            onmouseout="this.style.backgroundColor='var(--color-primary)'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            去设置页面配置
          </a>
        </div>

        <!-- 空状态 -->
        <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center">
          <div class="w-20 h-20 rounded-full flex items-center justify-center mb-6" style="background-color: var(--color-primary-light);">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <h3 class="text-xl font-semibold mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">开始新对话</h3>
          <p class="text-sm mb-6" style="color: var(--text-muted);">选择一个 AI 模型，输入您的问题开始对话</p>
          <div class="flex flex-wrap gap-2 justify-center max-w-md">
            <button class="quick-prompt px-4 py-2 rounded-md text-sm transition-colors duration-150"
              style="background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);"
              onmouseover="this.style.borderColor='var(--color-primary)'; this.style.backgroundColor='var(--surface-hover)'"
              onmouseout="this.style.borderColor='var(--border-default)'; this.style.backgroundColor='var(--surface-inset)'"
              data-prompt="帮我写一个科幻故事的开头">帮我写一个科幻故事的开头</button>
            <button class="quick-prompt px-4 py-2 rounded-md text-sm transition-colors duration-150"
              style="background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);"
              onmouseover="this.style.borderColor='var(--color-primary)'; this.style.backgroundColor='var(--surface-hover)'"
              onmouseout="this.style.borderColor='var(--border-default)'; this.style.backgroundColor='var(--surface-inset)'"
              data-prompt="解释一下量子计算的基本原理">解释量子计算原理</button>
            <button class="quick-prompt px-4 py-2 rounded-md text-sm transition-colors duration-150"
              style="background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);"
              onmouseover="this.style.borderColor='var(--color-primary)'; this.style.backgroundColor='var(--surface-hover)'"
              onmouseout="this.style.borderColor='var(--border-default)'; this.style.backgroundColor='var(--surface-inset)'"
              data-prompt="给我推荐一些提高工作效率的方法">提高工作效率的方法</button>
          </div>
        </div>

        <!-- 消息列表 -->
        <div id="message-list" class="flex flex-col gap-4" style="display: none;">
        </div>
      </div>

      <!-- 底部：输入框 -->
      <div class="p-4 border-t" style="border-color: var(--border-default); background-color: var(--surface-card);">
        <div class="flex gap-3 max-w-4xl mx-auto">
          <textarea id="chat-input"
            class="chat-input flex-1 px-4 py-3 rounded-lg text-sm resize-none"
            style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default); min-height: 44px; max-height: 200px;"
            placeholder="输入消息... (Shift+Enter 换行，Enter 发送)"
            rows="1"></textarea>
          <button id="send-btn" class="send-btn flex items-center justify-center px-4 rounded-lg transition-colors duration-150"
            style="background-color: var(--color-primary); color: var(--text-inverse);"
            onmouseover="if(!this.disabled)this.style.backgroundColor='var(--color-primary-hover)'"
            onmouseout="if(!this.disabled)this.style.backgroundColor='var(--color-primary)'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <p id="api-warning" class="text-xs mt-2 text-center" style="color: var(--state-warning); display: none;">
          请先在设置页面配置 API Key
        </p>
      </div>
    </div>

  </main>

</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // ===== 页面状态 =====
  let conversations = [];
  let currentConversationId = null;
  let messages = [];
  let isSending = false;
  let aiConfigured = false;

  // ===== DOM 元素 =====
  const conversationListEl = document.getElementById('conversation-list');
  const messageContainerEl = document.getElementById('message-container');
  const messageListEl = document.getElementById('message-list');
  const emptyStateEl = document.getElementById('empty-state');
  const apiSetupStateEl = document.getElementById('api-setup-state');
  const chatInputEl = document.getElementById('chat-input');
  const sendBtnEl = document.getElementById('send-btn');
  const newChatBtnEl = document.getElementById('new-chat-btn');
  const modelSelectEl = document.getElementById('model-select');
  const currentTitleEl = document.getElementById('current-conversation-title');
  const apiWarningEl = document.getElementById('api-warning');

  // ===== 初始化 =====
  async function init() {
    // 检查 AI 配置
    await ai.init();
    aiConfigured = ai.isConfigured();

    if (!aiConfigured) {
      showApiSetupState();
    } else {
      // 加载模型列表
      await loadModels();
    }

    // 加载对话列表
    await loadConversations();

    // 绑定事件
    bindEvents();
  }

  // ===== 显示API配置引导 =====
  function showApiSetupState() {
    apiSetupStateEl.style.display = 'flex';
    emptyStateEl.style.display = 'none';
    messageListEl.style.display = 'none';
    apiWarningEl.style.display = 'block';
    chatInputEl.disabled = true;
    sendBtnEl.disabled = true;
  }

  // ===== 隐藏API配置引导 =====
  function hideApiSetupState() {
    apiSetupStateEl.style.display = 'none';
    apiWarningEl.style.display = 'none';
    chatInputEl.disabled = false;
    sendBtnEl.disabled = false;
    renderMessages();
  }

  // ===== 加载模型列表 =====
  async function loadModels() {
    try {
      const models = await ai.getModels('chat');
      if (models && models.length > 0) {
        modelSelectEl.innerHTML = models.map(m => 
          `<option value="${m.id || m.model || m.name}">${m.name || m.id || m.model}</option>`
        ).join('');
        
        // 尝试设置默认模型 gpt-5.4-nano
        const defaultModel = 'gpt-5.4-nano';
        const hasDefault = models.some(m => 
          (m.id === defaultModel) || (m.model === defaultModel) || (m.name === defaultModel)
        );
        if (hasDefault) {
          modelSelectEl.value = defaultModel;
        }
      } else {
        modelSelectEl.innerHTML = '<option value="gpt-5.4-nano">GPT-5.4 Nano</option>';
      }
    } catch (e) {
      console.error('Failed to load models:', e);
      modelSelectEl.innerHTML = '<option value="gpt-5.4-nano">GPT-5.4 Nano</option>';
    }
  }

  // ===== 加载对话列表 =====
  async function loadConversations() {
    try {
      conversations = await db.getConversations();
      renderConversationList();
    } catch (e) {
      console.error('Failed to load conversations:', e);
      conversations = [];
      renderConversationList();
    }
  }

  // ===== 渲染对话列表 =====
  function renderConversationList() {
    if (!conversations || conversations.length === 0) {
      conversationListEl.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full py-12 text-center">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-bottom: 12px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <p class="text-sm" style="color: var(--text-muted);">暂无对话历史</p>
          <p class="text-xs mt-1" style="color: var(--text-muted);">点击上方按钮开始新对话</p>
        </div>
      `;
      return;
    }

    conversationListEl.innerHTML = conversations.map(conv => `
      <div class="conversation-item flex items-center gap-3 px-3 py-2.5 rounded-md cursor-pointer transition-colors duration-150 ${conv.id === currentConversationId ? 'active' : ''}"
        style="color: var(--text-body);"
        data-id="${conv.id}"
        onclick="selectConversation('${conv.id}')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); flex-shrink: 0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div class="flex-1 min-w-0">
          <p class="text-sm truncate" style="font-family: var(--font-heading); color: var(--text-heading);">${escapeHtml(conv.title || '新对话')}</p>
          <p class="text-xs truncate" style="color: var(--text-muted);">${formatDate(conv.updated_at)}</p>
        </div>
        <button class="delete-conv-btn p-1 rounded transition-colors duration-150"
          style="color: var(--text-muted);"
          onclick="event.stopPropagation(); deleteConversation('${conv.id}')"
          title="删除对话"
          onmouseover="this.style.color='var(--state-error)'"
          onmouseout="this.style.color='var(--text-muted)'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>
    `).join('');
  }

  // ===== 选择对话 =====
  async function selectConversation(id) {
    currentConversationId = id;
    const conv = conversations.find(c => c.id === id);

    if (conv) {
      messages = conv.messages || [];
      currentTitleEl.textContent = conv.title || '新对话';
      
      if (conv.model) {
        modelSelectEl.value = conv.model;
      }
      
      renderMessages();
      renderConversationList();
    }
  }

  // ===== 删除对话 =====
  async function deleteConversation(id) {
    if (!confirm('确定要删除这个对话吗？')) return;

    try {
      await db.deleteConversation(id);
      conversations = conversations.filter(c => c.id !== id);

      if (currentConversationId === id) {
        currentConversationId = null;
        messages = [];
        currentTitleEl.textContent = '';
        renderMessages();
      }

      renderConversationList();
      if (window.awShowToast) window.awShowToast('对话已删除');
    } catch (e) {
      console.error('Failed to delete conversation:', e);
      alert('删除失败，请重试');
    }
  }

  // ===== 渲染消息列表 =====
  function renderMessages() {
    if (!aiConfigured) {
      return;
    }

    if (!messages || messages.length === 0) {
      emptyStateEl.style.display = 'flex';
      messageListEl.style.display = 'none';
      return;
    }

    emptyStateEl.style.display = 'none';
    messageListEl.style.display = 'flex';

    messageListEl.innerHTML = messages.map(msg => {
      if (msg.role === 'user') {
        return `
          <div class="chat-message-user max-w-[80%] p-4 rounded-lg" style="background-color: var(--color-primary); color: var(--text-inverse);">
            <p class="message-content text-sm">${escapeHtml(msg.content)}</p>
          </div>
        `;
      } else {
        return `
          <div class="chat-message-ai max-w-[80%] p-4 rounded-lg border" style="background-color: var(--surface-card); border-color: var(--border-default);">
            <div class="flex items-start gap-3">
              <div class="flex items-center justify-center flex-shrink-0" style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-size: 12px; font-weight: 600;">AI</div>
              <div class="flex-1 min-w-0">
                <p class="text-xs mb-1" style="color: var(--text-muted);">${msg.model || 'AI'}</p>
                <p class="message-content text-sm" style="color: var(--text-body);">${escapeHtml(msg.content)}</p>
              </div>
            </div>
          </div>
        `;
      }
    }).join('');

    messageContainerEl.scrollTop = messageContainerEl.scrollHeight;
  }

  // ===== 添加正在思考的加载状态 =====
  function addTypingIndicator() {
    const typingDiv = document.createElement('div');
    typingDiv.id = 'typing-indicator';
    typingDiv.className = 'chat-message-ai max-w-[80%] p-4 rounded-lg border';
    typingDiv.style.cssText = 'background-color: var(--surface-card); border-color: var(--border-default);';
    typingDiv.innerHTML = `
      <div class="flex items-start gap-3">
        <div class="flex items-center justify-center flex-shrink-0" style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-size: 12px; font-weight: 600;">AI</div>
        <div class="flex-1 min-w-0">
          <p class="text-xs mb-2" style="color: var(--text-muted);">正在思考...</p>
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    `;
    messageListEl.appendChild(typingDiv);
    messageContainerEl.scrollTop = messageContainerEl.scrollHeight;
  }

  // ===== 移除正在思考的加载状态 =====
  function removeTypingIndicator() {
    const indicator = document.getElementById('typing-indicator');
    if (indicator) {
      indicator.remove();
    }
  }

  // ===== 发送消息 =====
  async function sendMessage() {
    const content = chatInputEl.value.trim();
    if (!content || isSending) return;

    if (!aiConfigured) {
      alert('请先在设置页面配置 API Key');
      return;
    }

    isSending = true;
    sendBtnEl.disabled = true;
    chatInputEl.disabled = true;

    const model = modelSelectEl.value;
    const userMessage = { role: 'user', content };

    emptyStateEl.style.display = 'none';
    messageListEl.style.display = 'flex';

    messages.push(userMessage);
    renderMessages();
    chatInputEl.value = '';
    autoResizeTextarea();

    addTypingIndicator();

    try {
      if (!currentConversationId) {
        const title = content.slice(0, 30) + (content.length > 30 ? '...' : '');
        const convData = {
          title,
          messages: [userMessage],
          model
        };
        const result = await db.createConversation(convData);
        const newConv = Array.isArray(result) ? result[0] : result;
        currentConversationId = newConv?.id;
        currentTitleEl.textContent = title;
        await loadConversations();
      } else {
        await db.addMessageToConversation(currentConversationId, userMessage);
      }

      const aiMessages = messages.map(m => ({ role: m.role, content: m.content }));
      const response = await ai.chat(model, aiMessages);

      removeTypingIndicator();

      const aiMessage = { role: 'assistant', content: response, model };
      messages.push(aiMessage);
      renderMessages();

      await db.addMessageToConversation(currentConversationId, aiMessage);

    } catch (e) {
      console.error('Failed to send message:', e);
      removeTypingIndicator();
      
      const errorMsg = { role: 'assistant', content: '抱歉，发生了错误：' + e.message, model: '系统' };
      messages.push(errorMsg);
      renderMessages();
      
      if (window.awShowToast) window.awShowToast('发送失败：' + e.message);
    } finally {
      isSending = false;
      sendBtnEl.disabled = false;
      chatInputEl.disabled = false;
      chatInputEl.focus();
    }
  }

  // ===== 新建对话 =====
  function newChat() {
    currentConversationId = null;
    messages = [];
    currentTitleEl.textContent = '';
    renderMessages();
    renderConversationList();
    chatInputEl.focus();
    if (window.awShowToast) window.awShowToast('已创建新对话');
  }

  // ===== 绑定事件 =====
  function bindEvents() {
    sendBtnEl.addEventListener('click', sendMessage);

    chatInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    chatInputEl.addEventListener('input', autoResizeTextarea);

    newChatBtnEl.addEventListener('click', newChat);

    document.querySelectorAll('.quick-prompt').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!aiConfigured) return;
        chatInputEl.value = btn.dataset.prompt;
        autoResizeTextarea();
        chatInputEl.focus();
      });
    });
  }

  // ===== 自动调整输入框高度 =====
  function autoResizeTextarea() {
    chatInputEl.style.height = 'auto';
    chatInputEl.style.height = Math.min(chatInputEl.scrollHeight, 200) + 'px';
  }

  // ===== 工具函数 =====
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    const now = new Date();
    const diff = now - date;

    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 604800000) return Math.floor(diff / 86400000) + ' 天前';

    return date.toLocaleDateString('zh-CN');
  }

  // ===== 启动 =====
  init();
</script>
</body>
</html>
