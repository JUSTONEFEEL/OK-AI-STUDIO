<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.png">
  <title>资源库 — OK AI ART</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline { --color-primary: var(--color-primary); --color-secondary: var(--color-secondary); }
    @layer base { body { background: var(--surface-bg); color: var(--text-body); } }
  </style>
</head>
<body class="min-h-screen font-sans antialiased" data-page="resources" style="font-family: var(--font-body); color: var(--text-body); background-color: var(--surface-bg);">

<div id="app-backdrop" class="app-backdrop"></div>

<!-- ===== LEFT SIDEBAR ===== -->

  style="width: var(--sidebar-width); background-color: var(--surface-inset); border-color: var(--border-default);">

      <img src="assets/ok-logo-64.png" alt="OK AI ART" style="width: 20px; height: 20px;" />
    </div>
    <span class="text-sm font-semibold tracking-tight" style="font-family: var(--font-heading); color: var(--text-heading);">OK AI ART</span>
  </div>
  <nav class="flex-1 overflow-y-auto py-4 px-3">
    <ul class="flex flex-col gap-1" style="list-style: none; margin: 0; padding: 0;">

      <li><a href="ai-employees.html" data-nav-key="ai-employees" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>AI员工</span></a></li>
      <li><a href="news-hub.html" data-nav-key="news-hub" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg><span>资讯台</span></a></li>
      <!-- AI Chat -->
      <li><a href="chat.html" data-nav-key="chat" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>AI对话</span></a></li>
      <li><a href="creative-studio.html" data-nav-key="creative-studio" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg><span>创作工坊</span></a></li>
      <li><a href="projects.html" data-nav-key="projects" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg><span>项目中心</span></a></li>
      <li><a href="resources.html" data-nav-key="resources" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg><span>资源库</span></a></li>
      <li><a href="nav.html" data-nav-key="nav" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span>热门导航</span></a></li>
      <li><a href="settings.html" data-nav-key="settings" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></a></li>
    </ul>
  </nav>
  <div class="px-4 py-4 border-t" style="border-color: var(--border-default);">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center flex-shrink-0 text-xs font-semibold" style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading);">U</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium truncate" style="font-family: var(--font-heading); color: var(--text-heading);">创作者</p>
        <p class="text-xs truncate" style="color: var(--text-muted);">专业版</p>
      </div>
    </div>
  </div>
</aside>

<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">
  <header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6 border-b gap-3" style="background-color: var(--surface-card); border-color: var(--border-default);">
    <div class="flex items-center gap-3 min-w-0">
      <button id="menu-toggle" class="menu-toggle items-center justify-center p-2 rounded-md" style="color: var(--text-secondary); display:none;" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="header-page-title text-lg font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">资源库</h1>
    </div>
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" data-role="search" placeholder="搜索资源..." class="w-full pl-9 pr-4 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
      </div>
    </div>
    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题"><svg data-theme-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg data-theme-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg></button>
      <div class="relative">
        <button id="notif-btn" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="通知"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="absolute top-1.5 right-1.5" style="width: 7px; height: 7px; background-color: var(--color-primary); border-radius: var(--radius-full);"></span></button>
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--color-primary);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">资源上传完成</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">角色立绘_主角.png 已就绪 · 10 分钟前</p></div></div>
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--state-warning);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">存储空间提醒</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">已使用 72%，建议清理冗余资源 · 昨天</p></div></div>
        </div>
      </div>
      <button class="flex items-center justify-center flex-shrink-0" style="width: 34px; height: 34px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 13px; font-weight: 600; transition: background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--color-primary)'; this.style.color='var(--text-inverse)'" onmouseout="this.style.backgroundColor='var(--color-primary-light)'; this.style.color='var(--color-primary)'" aria-label="用户菜单">U</button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto" style="background-color: var(--surface-bg);">
    <div class="p-4 sm:p-6 lg:p-8">

      <!-- Page Heading + Upload button -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <h2 class="text-2xl font-semibold" style="font-family: var(--font-heading); color: var(--text-heading); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">资源库</h2>
          <p class="mt-1 text-sm" style="font-family: var(--font-body); color: var(--text-secondary);">集中管理你的创作素材与产出</p>
        </div>
        <button class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;" onmouseover="this.style.backgroundColor='var(--color-primary-hover)'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='var(--color-primary)'; this.style.transform='translateY(0)'" onmousedown="this.style.transform='translateY(0)'" data-clickable="上传资源">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          上传资源
        </button>
      </div>

      <!-- Stats Summary Cards -->
      <div id="stats-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="flex flex-col p-5 border transition-colors duration-150" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
          <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">图片</span>
          <span id="stat-image" class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
        </div>
        <div class="flex flex-col p-5 border transition-colors duration-150" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
          <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">视频</span>
          <span id="stat-video" class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
        </div>
        <div class="flex flex-col p-5 border transition-colors duration-150" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
          <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">音频</span>
          <span id="stat-audio" class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
        </div>
        <div class="flex flex-col p-5 border transition-colors duration-150" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
          <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">文档</span>
          <span id="stat-document" class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
        </div>
      </div>

      <!-- Type Filter Bar -->
      <div class="flex items-center gap-1 p-1 rounded-md mb-6" style="background-color: var(--surface-inset); border: 1px solid var(--border-default); display: inline-flex;">
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="all" data-active="true" style="font-family: var(--font-heading);">全部</button>
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="image" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">图片</button>
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="video" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">视频</button>
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="audio" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">音频</button>
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="document" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">文档</button>
      </div>

      <!-- Resources Grid -->
      <div id="resources-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- 动态加载的资源卡片 -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="flex flex-col items-center justify-center py-16" style="display: none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-bottom: 16px;">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <p class="text-sm" style="font-family: var(--font-heading); color: var(--text-secondary); margin-bottom: 12px;">暂无资源，点击上传</p>
        <button id="empty-upload-btn" class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          上传资源
        </button>
      </div>

    </div>
  </main>
</div>

<!-- Upload Modal -->
<div id="upload-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none; background-color: rgba(0, 0, 0, 0.5);">
  <div class="relative w-full max-w-md border rounded-lg shadow-lg" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-lg);">
    <div class="flex items-center justify-between p-5 border-b" style="border-color: var(--border-default);">
      <h3 class="text-lg font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">上传资源</h3>
      <button id="modal-close" class="flex items-center justify-center p-1 rounded-md transition-colors duration-150" style="color: var(--text-muted);" onmouseover="this.style.color='var(--text-heading)'; this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.color='var(--text-muted)'; this.style.backgroundColor='transparent'" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="upload-form" class="p-5 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">名称</label>
        <input type="text" name="name" required class="w-full px-3 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" placeholder="输入资源名称" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">类型</label>
        <select name="type" required class="w-full px-3 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'">
          <option value="">选择类型</option>
          <option value="image">图片</option>
          <option value="video">视频</option>
          <option value="audio">音频</option>
          <option value="document">文档</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">资源 URL</label>
        <input type="url" name="url" required class="w-full px-3 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" placeholder="输入资源链接地址" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">大小（MB）</label>
        <input type="number" name="size" step="0.1" min="0" class="w-full px-3 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" placeholder="输入资源大小" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">描述</label>
        <textarea name="description" rows="2" class="w-full px-3 py-2 text-sm rounded-md outline-none transition-colors duration-150 resize-none" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" placeholder="输入资源描述"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">标签</label>
        <input type="text" name="tags" class="w-full px-3 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" placeholder="多个标签用逗号分隔" />
      </div>
      <div class="flex items-center justify-end gap-3 pt-2">
        <button type="button" id="modal-cancel" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='var(--surface-inset)'">取消</button>
        <button type="submit" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;" onmouseover="this.style.backgroundColor='var(--color-primary-hover)'" onmouseout="this.style.backgroundColor='var(--color-primary)'">上传</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none; background-color: rgba(0, 0, 0, 0.5);">
  <div class="relative w-full max-w-sm border rounded-lg shadow-lg" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-lg);">
    <div class="p-6 text-center">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--state-error); margin: 0 auto 16px;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <h3 class="text-lg font-semibold mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">确认删除</h3>
      <p class="text-sm mb-6" style="font-family: var(--font-body); color: var(--text-secondary);">此操作将永久删除该资源，无法恢复。确定要删除吗？</p>
      <div class="flex items-center justify-center gap-3">
        <button id="delete-cancel" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='var(--surface-inset)'">取消</button>
        <button id="delete-confirm" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--state-error); color: var(--text-inverse); border: none;" onmouseover="this.style.backgroundColor='var(--state-error-hover)'" onmouseout="this.style.backgroundColor='var(--state-error)'">删除</button>
      </div>
    </div>
  </div>
</div>

<!-- View Modal -->
<div id="view-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none; background-color: rgba(0, 0, 0, 0.5);">
  <div class="relative w-full max-w-2xl border rounded-lg shadow-lg" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-lg);">
    <div class="flex items-center justify-between p-5 border-b" style="border-color: var(--border-default);">
      <h3 id="view-title" class="text-lg font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">查看资源</h3>
      <button id="view-close" class="flex items-center justify-center p-1 rounded-md transition-colors duration-150" style="color: var(--text-muted);" onmouseover="this.style.color='var(--text-heading)'; this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.color='var(--text-muted)'; this.style.backgroundColor='transparent'" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="view-content" class="p-5">
      <!-- 动态内容 -->
    </div>
  </div>
</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  // ===== State =====
  var allResources = [];
  var currentFilter = 'all';
  var searchKeyword = '';
  var deleteTargetId = null;

  // ===== Icons by type =====
  var typeIcons = {
    image: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#6a9bcc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
    video: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
    audio: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#788c5d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    document: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9b7b6a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>'
  };

  var typeLabels = {
    image: '图片',
    video: '视频',
    audio: '音频',
    document: '文档'
  };

  var typeColors = {
    image: 'rgba(106, 155, 204, 0.10)',
    video: 'rgba(217, 119, 87, 0.10)',
    audio: 'rgba(120, 140, 93, 0.10)',
    document: 'rgba(155, 123, 106, 0.10)'
  };

  // ===== DOM Elements =====
  var grid = document.getElementById('resources-grid');
  var emptyState = document.getElementById('empty-state');
  var uploadBtn = document.querySelector('[data-clickable="上传资源"]');
  var emptyUploadBtn = document.getElementById('empty-upload-btn');
  var uploadModal = document.getElementById('upload-modal');
  var uploadForm = document.getElementById('upload-form');
  var modalClose = document.getElementById('modal-close');
  var modalCancel = document.getElementById('modal-cancel');
  var deleteModal = document.getElementById('delete-modal');
  var deleteCancel = document.getElementById('delete-cancel');
  var deleteConfirm = document.getElementById('delete-confirm');
  var viewModal = document.getElementById('view-modal');
  var viewClose = document.getElementById('view-close');
  var viewTitle = document.getElementById('view-title');
  var viewContent = document.getElementById('view-content');
  var searchInput = document.querySelector('[data-role="search"]');
  var tabs = document.querySelectorAll('.filter-tab');

  // ===== Functions =====
  function formatSize(mb) {
    if (!mb) return '未知';
    if (mb < 1) return (mb * 1024).toFixed(0) + 'KB';
    if (mb >= 1000) return (mb / 1000).toFixed(1) + 'GB';
    return mb.toFixed(1) + 'MB';
  }

  function renderResourceCard(resource) {
    var card = document.createElement('div');
    card.className = 'resource-card rounded-lg overflow-hidden transition-all duration-200';
    card.setAttribute('data-type', resource.type);
    card.setAttribute('data-id', resource.id);
    card.style.cssText = 'background-color: var(--surface-card); border: 1px solid var(--border-default);';
    card.onmouseover = function() { this.style.borderColor='var(--color-primary)'; this.style.transform='translateY(-2px)'; };
    card.onmouseout = function() { this.style.borderColor='var(--border-default)'; this.style.transform='translateY(0)'; };

    var isImage = resource.type === 'image' && resource.url;
    var previewHtml = '';

    if (isImage) {
      previewHtml = '<div class="relative overflow-hidden" style="aspect-ratio: 1 / 1; background-color: var(--surface-inset);">' +
        '<img src="' + resource.url + '" alt="' + resource.name + '" class="w-full h-full object-cover" onerror="this.style.display=\'none\'" />' +
        '<span class="absolute top-2 left-2 inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md whitespace-nowrap" style="font-family: var(--font-heading); background-color: rgba(20, 20, 19, 0.72); color: #fff;">' + typeLabels[resource.type] + '</span>' +
        '</div>';
    } else if (resource.type === 'video' && resource.url) {
      previewHtml = '<div class="relative overflow-hidden" style="aspect-ratio: 1 / 1; background-color: var(--surface-inset);">' +
        '<img src="' + (resource.thumbnail || resource.url) + '" alt="' + resource.name + '" class="w-full h-full object-cover" onerror="this.src=\'assets/image_1_yi19x4.jpg\'" />' +
        '<span class="absolute top-2 left-2 inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md whitespace-nowrap" style="font-family: var(--font-heading); background-color: rgba(20, 20, 19, 0.72); color: #fff;">' + typeLabels[resource.type] + '</span>' +
        '<div class="absolute inset-0 flex items-center justify-center">' +
          '<div class="flex items-center justify-center" style="width: 40px; height: 40px; background-color: rgba(20, 20, 19, 0.6); border-radius: var(--radius-full);">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
          '</div>' +
        '</div>' +
        '</div>';
    } else {
      previewHtml = '<div class="relative overflow-hidden flex items-center justify-center" style="aspect-ratio: 1 / 1; background-color: ' + typeColors[resource.type] + ';">' +
        typeIcons[resource.type] +
        '<span class="absolute top-2 left-2 inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md whitespace-nowrap" style="font-family: var(--font-heading); background-color: rgba(20, 20, 19, 0.72); color: #fff;">' + typeLabels[resource.type] + '</span>' +
        '</div>';
    }

    card.innerHTML = previewHtml +
      '<div class="p-3">' +
        '<p class="text-sm font-medium truncate mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">' + resource.name + '</p>' +
        '<p class="text-xs truncate mb-1.5" style="font-family: var(--font-body); color: var(--text-muted);">' + (resource.description || '暂无描述') + '</p>' +
        '<div class="flex items-center justify-between">' +
          '<span class="text-xs" style="font-family: var(--font-body); color: var(--text-muted);">' + formatSize(resource.size) + '</span>' +
          '<div class="flex items-center gap-1">' +
            '<button class="view-btn inline-flex items-center justify-center p-1 rounded-md transition-colors duration-150" style="color: var(--text-muted);" onmouseover="this.style.color=\'var(--color-primary)\'; this.style.backgroundColor=\'var(--surface-hover)\'" onmouseout="this.style.color=\'var(--text-muted)\'; this.style.backgroundColor=\'transparent\'" aria-label="查看">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' +
            '</button>' +
            '<button class="delete-btn inline-flex items-center justify-center p-1 rounded-md transition-colors duration-150" style="color: var(--text-muted);" onmouseover="this.style.color=\'var(--state-error)\'; this.style.backgroundColor=\'var(--surface-hover)\'" onmouseout="this.style.color=\'var(--text-muted)\'; this.style.backgroundColor=\'transparent\'" aria-label="删除">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    // 绑定事件
    var viewBtn = card.querySelector('.view-btn');
    var deleteBtn = card.querySelector('.delete-btn');

    viewBtn.addEventListener('click', function() {
      showViewModal(resource);
    });

    deleteBtn.addEventListener('click', function() {
      deleteTargetId = resource.id;
      deleteModal.style.display = 'flex';
    });

    return card;
  }

  function renderResources() {
    grid.innerHTML = '';

    var filtered = allResources.filter(function(r) {
      var matchFilter = (currentFilter === 'all' || r.type === currentFilter);
      var matchSearch = (!searchKeyword || r.name.toLowerCase().indexOf(searchKeyword.toLowerCase()) >= 0);
      return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
      emptyState.style.display = 'flex';
      grid.style.display = 'none';
    } else {
      emptyState.style.display = 'none';
      grid.style.display = 'grid';
      filtered.forEach(function(resource) {
        grid.appendChild(renderResourceCard(resource));
      });
    }
  }

  function updateStats() {
    var stats = { image: 0, video: 0, audio: 0, document: 0 };
    allResources.forEach(function(r) {
      if (stats[r.type] !== undefined) stats[r.type]++;
    });
    document.getElementById('stat-image').textContent = stats.image;
    document.getElementById('stat-video').textContent = stats.video;
    document.getElementById('stat-audio').textContent = stats.audio;
    document.getElementById('stat-document').textContent = stats.document;
  }

  function loadResources() {
    db.getResources().then(function(data) {
      allResources = data || [];
      renderResources();
      updateStats();
    }).catch(function(err) {
      console.error('加载资源失败:', err);
      allResources = [];
      renderResources();
    });
  }

  function showViewModal(resource) {
    viewTitle.textContent = resource.name;

    var html = '<div class="space-y-4">';
    html += '<div class="flex items-center gap-2 mb-4">';
    html += '<span class="inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md" style="font-family: var(--font-heading); background-color: var(--color-primary-light); color: var(--color-primary);">' + typeLabels[resource.type] + '</span>';
    html += '<span class="text-xs" style="font-family: var(--font-body); color: var(--text-muted);">' + formatSize(resource.size) + '</span>';
    html += '</div>';

    if (resource.type === 'image' && resource.url) {
      html += '<div class="overflow-hidden rounded-md" style="background-color: var(--surface-inset);"><img src="' + resource.url + '" alt="' + resource.name + '" class="w-full" onerror="this.style.display=\'none\'" /></div>';
    } else if (resource.type === 'video' && resource.url) {
      html += '<div class="overflow-hidden rounded-md" style="background-color: var(--surface-inset);"><video src="' + resource.url + '" controls class="w-full"></video></div>';
    } else if (resource.type === 'audio' && resource.url) {
      html += '<div class="flex items-center justify-center p-8 rounded-md" style="background-color: ' + typeColors[resource.type] + ';">' + typeIcons[resource.type] + '</div>';
      html += '<audio src="' + resource.url + '" controls class="w-full mt-4"></audio>';
    } else {
      html += '<div class="flex items-center justify-center p-8 rounded-md" style="background-color: ' + typeColors[resource.type] + ';">' + typeIcons[resource.type] + '</div>';
    }

    if (resource.description) {
      html += '<div><p class="text-sm font-medium mb-1" style="font-family: var(--font-heading); color: var(--text-heading);">描述</p><p class="text-sm" style="font-family: var(--font-body); color: var(--text-secondary);">' + resource.description + '</p></div>';
    }

    if (resource.url) {
      html += '<div><p class="text-sm font-medium mb-1" style="font-family: var(--font-heading); color: var(--text-heading);">链接</p><a href="' + resource.url + '" target="_blank" class="text-sm hover:underline" style="font-family: var(--font-body); color: var(--color-primary);">' + resource.url + '</a></div>';
    }

    if (resource.tags && resource.tags.length > 0) {
      html += '<div><p class="text-sm font-medium mb-1" style="font-family: var(--font-heading); color: var(--text-heading);">标签</p><div class="flex flex-wrap gap-2">';
      resource.tags.forEach(function(tag) {
        html += '<span class="inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-secondary); border: 1px solid var(--border-default);">' + tag + '</span>';
      });
      html += '</div></div>';
    }

    html += '<div class="flex items-center justify-end pt-2"><a href="' + resource.url + '" target="_blank" download class="inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;" onmouseover="this.style.backgroundColor=\'var(--color-primary-hover)\'" onmouseout="this.style.backgroundColor=\'var(--color-primary)\'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</a></div>';

    html += '</div>';
    viewContent.innerHTML = html;
    viewModal.style.display = 'flex';
  }

  // ===== Event Bindings =====

  // 筛选 Tab
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) {
        t.removeAttribute('data-active');
        t.style.fontWeight = 'normal';
        t.style.color = 'var(--text-secondary)';
        t.style.background = 'transparent';
      });
      tab.setAttribute('data-active', 'true');
      currentFilter = tab.getAttribute('data-filter');
      renderResources();
    });
  });

  // 搜索
  if (searchInput) {
    searchInput.addEventListener('input', function(e) {
      searchKeyword = e.target.value.trim();
      renderResources();
    });
  }

  // 上传按钮
  function openUploadModal() {
    uploadModal.style.display = 'flex';
    uploadForm.reset();
  }

  if (uploadBtn) uploadBtn.addEventListener('click', openUploadModal);
  if (emptyUploadBtn) emptyUploadBtn.addEventListener('click', openUploadModal);

  // 关闭上传 Modal
  if (modalClose) modalClose.addEventListener('click', function() { uploadModal.style.display = 'none'; });
  if (modalCancel) modalCancel.addEventListener('click', function() { uploadModal.style.display = 'none'; });

  // 上传表单提交
  if (uploadForm) {
    uploadForm.addEventListener('submit', function(e) {
      e.preventDefault();
      var formData = new FormData(uploadForm);
      var data = {
        name: formData.get('name'),
        type: formData.get('type'),
        url: formData.get('url'),
        size: parseFloat(formData.get('size')) || 0,
        description: formData.get('description') || '',
        tags: formData.get('tags') ? formData.get('tags').split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t; }) : []
      };

      db.createResource(data).then(function() {
        uploadModal.style.display = 'none';
        loadResources();
      }).catch(function(err) {
        console.error('上传失败:', err);
        alert('上传失败: ' + err.message);
      });
    });
  }

  // 删除确认 Modal
  if (deleteCancel) {
    deleteCancel.addEventListener('click', function() {
      deleteModal.style.display = 'none';
      deleteTargetId = null;
    });
  }

  if (deleteConfirm) {
    deleteConfirm.addEventListener('click', function() {
      if (deleteTargetId) {
        db.deleteResource(deleteTargetId).then(function() {
          deleteModal.style.display = 'none';
          deleteTargetId = null;
          loadResources();
        }).catch(function(err) {
          console.error('删除失败:', err);
          alert('删除失败: ' + err.message);
        });
      }
    });
  }

  // 关闭查看 Modal
  if (viewClose) {
    viewClose.addEventListener('click', function() { viewModal.style.display = 'none'; });
  }

  // 点击背景关闭 Modal
  uploadModal.addEventListener('click', function(e) {
    if (e.target === uploadModal) uploadModal.style.display = 'none';
  });

  deleteModal.addEventListener('click', function(e) {
    if (e.target === deleteModal) {
      deleteModal.style.display = 'none';
      deleteTargetId = null;
    }
  });

  viewModal.addEventListener('click', function(e) {
    if (e.target === viewModal) viewModal.style.display = 'none';
  });

  // ===== Initialize =====
  loadResources();
})();
</script>
</body>
</html>
