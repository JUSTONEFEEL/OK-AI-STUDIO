        '<span class="text-xs" style="font-family: var(--font-body); color: var(--text-muted);">点击查看详情</span>' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>' +
        '</div></div>';
    }).join('');

    if (filtered.length === 0) {
      var emptyMsg = currentCat === 'fav' ? '还没有收藏任何网站，点击卡片右上角爱心图标收藏吧' : '没有找到匹配的 AI 工具';
      grid.innerHTML = '<div class="col-span-full text-center py-16"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin: 0 auto 12px;"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg><p class="text-sm" style="font-family: var(--font-heading); color: var(--text-muted);">' + emptyMsg + '</p></div>';
    }
  }

  // ===== Detail Modal =====
  window.openDetail = function(url) {
    var d = null;
    for (var i = 0; i < navData.length; i++) {
      if (navData[i].url === url) { d = navData[i]; break; }
    }
    if (!d) return;

    var hostname = (function(u) { try { return new URL(u).hostname; } catch(e) { return ''; } })(d.url);
    var faviconUrl = hostname ? 'https://www.google.com/s2/favicons?domain=' + hostname + '&sz=64' : '';
    var isFav = favorites.indexOf(d.url) !== -1;
    var content = document.getElementById('detail-content');
    content.innerHTML =
      '<div class="flex items-center gap-4 mb-4">' +
      '<div style="position:relative;width:56px;height:56px;flex-shrink:0;border-radius:12px;overflow:hidden;background-color:var(--surface-inset);display:flex;align-items:center;justify-content:center;font-size:28px;">' + (catIcons[d.cat] || '🔗') +
      (faviconUrl ? '<img src="' + faviconUrl + '" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;border-radius:12px;background:white;" />' : '') +
      '</div>' +
      '<div>' +
      '<h2 class="text-xl font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">' + d.name + '</h2>' +
      '<span class="category-tag" style="background-color: var(--color-primary-light); color: var(--color-primary);">' + (catLabels[d.cat] || d.cat) + '</span>' +
      '</div>' +
      '<button class="flex-shrink-0 p-1.5 rounded-md transition-colors" style="background:none;border:none;cursor:pointer;margin-left:auto;" onclick="event.stopPropagation();toggleFavorite(\'' + d.url.replace(/'/g, "\\'") + '\')" onmouseover="this.style.backgroundColor=\'var(--surface-hover)\'" onmouseout="this.style.backgroundColor=\'transparent\'" title="' + (isFav ? '取消收藏' : '收藏') + '">' +
      (isFav
        ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
        : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>') +
      '</button></div>' +
      '<p class="text-sm leading-relaxed mb-4" style="font-family: var(--font-body); color: var(--text-body);">' + d.desc + '</p>' +
      '<div class="rounded-lg p-4 mb-4" style="background-color: var(--surface-inset); border: 1px solid var(--border-subtle);">' +
      '<p class="text-xs mb-1" style="font-family: var(--font-heading); color: var(--text-muted);">网站地址</p>' +
      '<p class="text-sm font-mono break-all" style="font-family: monospace; color: var(--color-primary);">' + d.url + '</p>' +
      '</div>' +
      '<a href="' + d.url + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 w-full px-5 py-3 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); text-decoration: none;" onmouseover="this.style.backgroundColor=\'var(--color-primary-hover)\'" onmouseout="this.style.backgroundColor=\'var(--color-primary)\'">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
      '访问网站</a>';

    document.getElementById('detail-modal').style.display = 'flex';
  };

  window.closeDetail = function() {
    document.getElementById('detail-modal').style.display = 'none';
  };

  // ESC to close
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeDetail();
  });

  // Initial render
  renderCards();
})();
</script>
</body>
</html>
