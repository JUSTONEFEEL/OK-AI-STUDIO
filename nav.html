      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.15);

      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-weight: 600;
      font-family: var(--font-heading);
    }
    .search-input:focus {
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 2px var(--color-primary-light) !important;
    }
    .detail-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 100; display: flex;
      align-items: center; justify-content: center;
    }
    .detail-modal-content {
      max-width: 560px; width: 90%; max-height: 80vh;
      border-radius: 12px; padding: 28px; overflow-y: auto;
      position: relative;
    }
  </style>

    { name: 'ElevenLabs', desc: '顶级 AI 语音合成和克隆，支持 29 种语言', url: 'https://elevenlabs.io', cat: 'audio', catLabel: '音频音乐', icon: '🎙️', tags: ['TTS', '语音克隆', '多语言'], featured: true },
    { name: 'Udio', desc: 'AI 音乐创作平台，由前 Google DeepMind 研究员创立', url: 'https://www.udio.com', cat: 'audio', catLabel: '音频音乐', icon: '🎶', tags: ['音乐', '创作', '高质量'], featured: false },

    // 效率工具
    { name: 'Notion AI', desc: '集成 AI 的笔记和知识管理工具，AI 辅助写作', url: 'https://www.notion.so/product/ai', cat: 'productivity', catLabel: '效率工具', icon: '📋', tags: ['笔记', '知识管理', '写作'], featured: false },
    { name: 'Gamma', desc: 'AI 驱动的演示文稿生成工具，一键生成 PPT', url: 'https://gamma.app', cat: 'productivity', catLabel: '效率工具', icon: '📊', tags: ['PPT', '演示', 'AI生成'], featured: false },
    { name: 'Cursor', desc: 'AI 编程 IDE，集成 GPT-5/Claude，开发者效率神器', url: 'https://cursor.sh', cat: 'productivity', catLabel: '效率工具', icon: '💻', tags: ['编程', 'IDE', 'AI助手'], featured: true },
    { name: 'GitHub Copilot', desc: '微软 AI 编程助手，深度集成 GitHub 和 VS Code', url: 'https://github.com/features/copilot', cat: 'productivity', catLabel: '效率工具', icon: '👨‍💻', tags: ['微软', '编程', 'GitHub'], featured: false },
    { name: 'Napkin AI', desc: 'AI 图表生成工具，文字秒变流程图和架构图', url: 'https://www.napkin.ai', cat: 'productivity', catLabel: '效率工具', icon: '📈', tags: ['图表', '可视化', '流程图'], featured: false },

    // 开发平台
    { name: 'Hugging Face', desc: '全球最大 AI 模型社区，开源模型和数据集宝库', url: 'https://huggingface.co', cat: 'dev', catLabel: '开发者', icon: '🤗', tags: ['开源', '模型', '社区'], featured: true },
    { name: 'Replicate', desc: '云端 AI 模型运行平台，API 一键调用', url: 'https://replicate.com', cat: 'dev', catLabel: '开发者', icon: '☁️', tags: ['API', '云端', '模型'], featured: false },
    { name: 'Vercel AI', desc: 'AI 应用开发平台，快速构建和部署 AI 产品', url: 'https://vercel.com/ai', cat: 'dev', catLabel: '开发者', icon: '🚀', tags: ['部署', 'SDK', '开发'], featured: false },
    { name: 'LangChain', desc: 'LLM 应用开发框架，构建 AI Agent 和 RAG 应用', url: 'https://www.langchain.com', cat: 'dev', catLabel: '开发者', icon: '🔗', tags: ['框架', 'Agent', 'RAG'], featured: false },
    { name: 'ComfyUI', desc: '节点式 AI 图像生成工作流工具，可视化编排', url: 'https://www.comfy.org', cat: 'dev', catLabel: '开发者', icon: '🧩', tags: ['工作流', '图像', '可视化'], featured: false },

    // 设计/创意
    { name: 'Figma AI', desc: 'AI 增强的 UI/UX 设计工具，智能布局和设计建议', url: 'https://www.figma.com/ai', cat: 'design', catLabel: '设计创意', icon: '🎯', tags: ['UI', '设计', '协作'], featured: false },
    { name: 'Adobe Firefly', desc: 'Adobe 旗下 AI 创意工具，集成 Photoshop 等', url: 'https://www.adobe.com/products/firefly.html', cat: 'design', catLabel: '设计创意', icon: '🦋', tags: ['Adobe', '创意', '设计'], featured: false },
    { name: 'Remove.bg', desc: 'AI 一键抠图，背景去除速度快如闪电', url: 'https://www.remove.bg', cat: 'design', catLabel: '设计创意', icon: '✂️', tags: ['抠图', '背景', '快速'], featured: false }
  ];

  // ===== Render =====
  var grid = document.getElementById('nav-grid');
  var categoryFilters = document.getElementById('category-filters');
  var searchInput = document.getElementById('search-input');
  var currentCat = 'all';
  var currentSearch = '';

  // Build category filters
  var cats = ['all'].concat([...new Set(navData.map(function(d) { return d.cat; }))]);
  var catLabels = { all: '全部' };
  navData.forEach(function(d) { catLabels[d.cat] = d.catLabel; });

  cats.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'category-filter px-4 py-1.5 text-sm font-medium rounded-full transition-colors duration-150';
    btn.setAttribute('data-cat', cat);
    btn.textContent = catLabels[cat] || cat;
    btn.style.cssText = 'font-family: var(--font-heading); background-color: var(--surface-card); color: var(--text-secondary); border: 1px solid var(--border-default); cursor: pointer;';
    if (cat === 'all') { btn.classList.add('active'); btn.style.cssText += 'background-color: var(--color-primary) !important; color: #fff !important; border-color: var(--color-primary) !important;'; }
    btn.addEventListener('click', function() {
      document.querySelectorAll('.category-filter').forEach(function(b) {
        b.classList.remove('active');
        b.style.cssText = 'font-family: var(--font-heading); background-color: var(--surface-card); color: var(--text-secondary); border: 1px solid var(--border-default); cursor: pointer;';
      });
      btn.classList.add('active');
      btn.style.cssText += 'background-color: var(--color-primary) !important; color: #fff !important; border-color: var(--color-primary) !important;';
      currentCat = cat;
      renderCards();
    });
    categoryFilters.appendChild(btn);
  });

  // Search
  searchInput.addEventListener('input', function() {
    currentSearch = this.value.trim().toLowerCase();
    renderCards();
  });

  function renderCards() {
    var filtered = navData.filter(function(d) {
      var matchCat = currentCat === 'all' || d.cat === currentCat;
      var matchSearch = !currentSearch || d.name.toLowerCase().includes(currentSearch) || d.desc.toLowerCase().includes(currentSearch) || d.tags.some(function(t) { return t.toLowerCase().includes(currentSearch); });
      return matchCat && matchSearch;
    });

    grid.innerHTML = filtered.map(function(d, i) {
      return '<div class="nav-card rounded-lg p-5" style="background-color: var(--surface-card); border: 1px solid var(--border-default);" onclick="openDetail(' + i + ', \'' + d.cat + '\')">' +
        '<div class="flex items-start justify-between mb-3">' +
        '<div class="flex items-center gap-3">' +
        '<div class="flex items-center justify-center flex-shrink-0 rounded-lg" style="width: 40px; height: 40px; background-color: var(--surface-inset); font-size: 20px;">' + d.icon + '</div>' +
        '<div class="min-w-0">' +
        '<h3 class="text-sm font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">' + d.name + (d.featured ? ' <span style="color:var(--color-primary);font-size:11px;">★</span>' : '') + '</h3>' +
        '<span class="category-tag" style="background-color: var(--color-primary-light); color: var(--color-primary);">' + d.catLabel + '</span>' +
        '</div></div></div>' +
        '<p class="text-xs leading-relaxed mb-3" style="font-family: var(--font-body); color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">' + d.desc + '</p>' +
        '<div class="flex flex-wrap gap-1.5">' +
        d.tags.map(function(t) { return '<span class="text-xs px-2 py-0.5 rounded" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-muted);">' + t + '</span>'; }).join('') +
        '</div>' +
        '<div class="flex items-center justify-between mt-3 pt-3" style="border-top: 1px solid var(--border-subtle);">' +
        '<span class="text-xs" style="font-family: var(--font-body); color: var(--text-muted);">点击查看详情</span>' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>' +
        '</div></div>';
    }).join('');

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="col-span-full text-center py-16"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin: 0 auto 12px;"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg><p class="text-sm" style="font-family: var(--font-heading); color: var(--text-muted);">没有找到匹配的 AI 工具</p></div>';
    }
  }

  // ===== Detail Modal =====
  var filteredCache = [];
  window.openDetail = function(idx, cat) {
    // Re-filter to get the correct item
    var filtered = navData.filter(function(d) {
      var matchCat = currentCat === 'all' || d.cat === currentCat;
      var matchSearch = !currentSearch || d.name.toLowerCase().includes(currentSearch) || d.desc.toLowerCase().includes(currentSearch) || d.tags.some(function(t) { return t.toLowerCase().includes(currentSearch); });
      return matchCat && matchSearch;
    });
    var d = filtered[idx];
    if (!d) return;

    var content = document.getElementById('detail-content');
    content.innerHTML =
      '<div class="flex items-center gap-4 mb-4">' +
      '<div class="flex items-center justify-center flex-shrink-0 rounded-lg" style="width: 56px; height: 56px; background-color: var(--surface-inset); font-size: 28px;">' + d.icon + '</div>' +
      '<div>' +
      '<h2 class="text-xl font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">' + d.name + (d.featured ? ' <span style="color:var(--color-primary);">★</span>' : '') + '</h2>' +
      '<span class="category-tag" style="background-color: var(--color-primary-light); color: var(--color-primary);">' + d.catLabel + '</span>' +
      '</div></div>' +
      '<p class="text-sm leading-relaxed mb-4" style="font-family: var(--font-body); color: var(--text-body);">' + d.desc + '</p>' +
      '<div class="flex flex-wrap gap-1.5 mb-4">' + d.tags.map(function(t) { return '<span class="text-xs px-2 py-0.5 rounded" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-muted); border: 1px solid var(--border-subtle);">' + t + '</span>'; }).join('') + '</div>' +
      '<div class="rounded-lg p-4 mb-4" style="background-color: var(--surface-inset); border: 1px solid var(--border-subtle);">' +
      '<p class="text-xs mb-1" style="font-family: var(--font-heading); color: var(--text-muted);">网站地址</p>' +
      '<p class="text-sm font-mono break-all" style="font-family: monospace; color: var(--color-primary);">' + d.url + '</p>' +
      '</div>' +
      '<a href="' + d.url + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 w-full px-5 py-3 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); text-decoration: none;" onmouseover="this.style.backgroundColor=\'var(--color-primary-hover)\'" onmouseout="this.style.backgroundColor=\'var(--color-primary)\'">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
      '访问网站</a>';

    document.getElementById('detail-modal').style.display = 'flex';
  };

  window.closeDetail = function() {
    document.getElementById('detail-modal').style.display = 'none';
  };

  // ESC to close
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeDetail();
  });

  // Initial render
  renderCards();
})();
</script>
</body>
</html>
