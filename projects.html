<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">
  <header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6 border-b gap-3" style="background-color: var(--surface-card); border-color: var(--border-default);">
    <div class="flex items-center gap-3 min-w-0">
      <button id="menu-toggle" class="menu-toggle items-center justify-center p-2 rounded-md" style="color: var(--text-secondary); display:none;" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="header-page-title text-lg font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">项目中心</h1>
    </div>
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>

      </div>
    </div>
    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题"><svg data-theme-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg data-theme-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg></button>
      <div class="relative">
        <button id="notif-btn" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="通知"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="absolute top-1.5 right-1.5" style="width: 7px; height: 7px; background-color: var(--color-primary); border-radius: var(--radius-full);"></span></button>
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--color-primary);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">项目进度提醒</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">星际漫旅 已完成第 4 集 · 1 小时前</p></div></div>
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--state-success);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">项目已归档</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">校园往事 已转入归档 · 昨天</p></div></div>
        </div>
      </div>
      <div class="relative" id="user-menu-container">
        <button id="user-menu-btn" class="flex items-center justify-center flex-shrink-0" style="width: 34px; height: 34px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 13px; font-weight: 600; transition: background-color 150ms ease;" aria-label="用户菜单">U</button>
        <div id="user-dropdown" class="user-dropdown" style="position:absolute;top:calc(100% + 8px);right:0;min-width:280px;background:var(--surface-elevated);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);z-index:9999;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity 150ms ease, transform 150ms ease;">
          <div style="padding:20px;border-bottom:1px solid var(--border-subtle);">
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
              <div style="width:56px;height:56px;border-radius:50%;background:var(--color-primary-light);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;font-family:var(--font-heading);flex-shrink:0;">U</div>
              <div style="min-width:0;">
                <p style="font-size:18px;font-weight:600;font-family:var(--font-heading);color:var(--text-heading);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">创作者小明</p>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-inset);border-radius:var(--radius-md);">
              <span style="font-size:13px;font-family:monospace;color:var(--text-muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">a1b2c3d4-e5f6-7890-abcd-ef...</span>
              <button title="复制" style="background:none;border:none;cursor:pointer;padding:4px;border-radius:4px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='transparent'" onclick="navigator.clipboard.writeText('a1b2c3d4-e5f6-7890-abcd-ef1234567890');window.awShowToast('已复制用户ID');">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
            </div>
          </div>
          <div style="padding:12px 20px;border-bottom:1px solid var(--border-subtle);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
              <span style="font-size:14px;font-family:var(--font-body);color:var(--text-secondary);">个人钱包剩余</span>
              <span id="user-balance" style="font-size:18px;font-weight:700;font-family:var(--font-heading);color:var(--text-heading);">¥0.00</span>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:14px;font-family:var(--font-body);color:var(--text-secondary);">项目钱包剩余</span>
              <span style="font-size:18px;font-weight:700;font-family:var(--font-heading);color:var(--text-heading);">¥0.00</span>
            </div>
          </div>
          <div style="padding:8px;border-bottom:1px solid var(--border-subtle);">
            <button style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:none;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:15px;font-family:var(--font-heading);color:var(--text-body);text-align:left;transition:background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='transparent'" onclick="window.awShowToast('个人资料');closeUserDropdown();">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);flex-shrink:0;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              个人资料
            </button>
            <button style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:none;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:15px;font-family:var(--font-heading);color:var(--text-body);text-align:left;transition:background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='transparent'" onclick="window.awShowToast('学习记录');closeUserDropdown();">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);flex-shrink:0;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              学习记录
            </button>
            <button style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:none;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:15px;font-family:var(--font-heading);color:var(--text-body);text-align:left;transition:background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='transparent'" onclick="window.awShowToast('创作记录');closeUserDropdown();">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);flex-shrink:0;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              创作记录
            </button>
          </div>
          <div style="padding:8px;">
            <button style="width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:none;border:none;border-radius:var(--radius-md);cursor:pointer;font-size:15px;font-family:var(--font-heading);color:#ef4444;text-align:left;transition:background-color 150ms ease;" onmouseover="this.style.backgroundColor='rgba(239,68,68,0.08)'" onmouseout="this.style.backgroundColor='transparent'" onclick="showLogoutModal();closeUserDropdown();">

          </div>
        </div>

        <div>
          <h2 class="text-2xl font-semibold" style="font-family: var(--font-heading); color: var(--text-heading); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">项目中心</h2>
          <p class="mt-1 text-sm" style="font-family: var(--font-body); color: var(--text-secondary);">管理你的所有创作项目</p>
        </div>
        <button class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;" onmouseover="this.style.backgroundColor='var(--color-primary-hover)'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='var(--color-primary)'; this.style.transform='translateY(0)'" onmousedown="this.style.transform='translateY(0)'" data-clickable="新建项目">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          新建项目
        </button>
      </div>

      <!-- Filter Bar -->
      <div class="flex items-center gap-1 p-1 rounded-md mb-6" style="background-color: var(--surface-inset); border: 1px solid var(--border-default); display: inline-flex;">
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="all" data-active="true" style="font-family: var(--font-heading);">全部</button>
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="ongoing" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">进行中</button>
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="done" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">已完成</button>
        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="archived" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">已归档</button>
      </div>

      <!-- Projects Grid -->
      <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- 项目卡片由 JavaScript 动态加载 -->
      </div>

    </div>
  </main>
</div>

<script src="assets/js/ai.js?v=2"></script>
<script src="assets/js/app.js?v=2"></script>
<script src="assets/js/db.js"></script>
<script>
(function () {
  // ===== State =====
  var allProjects = [];
  var currentFilter = 'all';
  var searchQuery = '';
  var editingProjectId = null;

  // ===== DOM Elements =====
  var grid = document.getElementById('projects-grid');
  var tabs = document.querySelectorAll('.filter-tab');
  var searchInput = document.querySelector('input[data-role="search"]');
  var newProjectBtn = document.querySelector('button[data-clickable="新建项目"]');

  // ===== Status Badge Helper =====
  function getStatusBadge(status) {
    var badges = {
      ongoing: { text: '进行中', bg: 'rgba(217, 119, 87, 0.08)', color: 'var(--color-primary)' },
      done: { text: '已完成', bg: 'rgba(34, 197, 94, 0.10)', color: 'var(--state-success)' },
      archived: { text: '已归档', bg: 'var(--surface-inset)', color: 'var(--text-muted)' }
    };
    return badges[status] || badges.ongoing;
  }

  // ===== Get Progress Color =====
  function getProgressColor(status, progress) {
    if (status === 'done' || progress >= 100) return 'var(--state-success)';
    if (status === 'archived') return 'var(--text-muted)';
    return 'var(--color-primary)';
  }

  // ===== Render Project Card =====
  function renderProjectCard(project) {
    var badge = getStatusBadge(project.status);
    var progressColor = getProgressColor(project.status, project.progress || 0);
    var opacity = project.status === 'archived' ? '0.85' : '1';

    var card = document.createElement('div');
    card.className = 'project-card rounded-lg overflow-hidden transition-all duration-200';
    card.setAttribute('data-status', project.status);
    card.setAttribute('data-id', project.id);
    card.style.cssText = 'background-color: var(--surface-card); border: 1px solid var(--border-default); opacity: ' + opacity + ';';
    card.onmouseover = function() { this.style.borderColor='var(--color-primary)'; this.style.transform='translateY(-2px)'; this.style.cursor='pointer'; };
    card.onmouseout = function() { this.style.borderColor='var(--border-default)'; this.style.transform='translateY(0)'; };
    card.addEventListener('click', function() {
      window.location.href = 'canvas.html?id=' + encodeURIComponent(project.id) + '&title=' + encodeURIComponent(project.title || '');
    });

    card.innerHTML =
      '<div class="overflow-hidden" style="height: 160px; background-color: var(--surface-inset);">' +
        '<img src="' + (project.cover || 'assets/image_1_yi19x4.jpg') + '" alt="' + (project.title || '') + '项目封面" class="w-full h-full object-cover" />' +
      '</div>' +
      '<div class="p-5">' +
        '<div class="flex items-center justify-between mb-2">' +
          '<span class="inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md whitespace-nowrap" style="font-family: var(--font-heading); background-color: ' + badge.bg + '; color: ' + badge.color + ';">' + badge.text + '</span>' +
        '</div>' +
        '<h3 class="text-base font-semibold truncate mb-1" style="font-family: var(--font-heading); color: var(--text-heading);">' + (project.title || '未命名项目') + '</h3>' +
        '<p class="text-xs truncate mb-3" style="font-family: var(--font-body); color: var(--text-secondary);">' + (project.description || '暂无描述') + '</p>' +
        '<div class="flex items-center gap-2 mb-4">' +
          '<div class="flex-1 h-1.5 rounded-full overflow-hidden" style="background-color: var(--surface-inset);">' +
            '<div class="h-full rounded-full" style="width: ' + (project.progress || 0) + '%; background-color: ' + progressColor + ';"></div>' +
          '</div>' +
          '<span class="text-xs whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-muted);">' + (project.progress || 0) + '%</span>' +
        '</div>' +
        '<div class="flex items-center justify-end gap-2">' +
          '<button class="edit-btn inline-flex items-center justify-center px-3 py-1.5 text-xs rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-secondary); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor=\'var(--surface-hover)\'" onmouseout="this.style.backgroundColor=\'var(--surface-inset)\'">编辑</button>' +
          '<button class="delete-btn inline-flex items-center justify-center px-3 py-1.5 text-xs rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--state-error); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor=\'rgba(239, 68, 68, 0.1)\'" onmouseout="this.style.backgroundColor=\'var(--surface-inset)\'">删除</button>' +
        '</div>' +
      '</div>';

    // 绑定编辑按钮
    card.querySelector('.edit-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      openEditModal(project);
    });

    // 绑定删除按钮
    card.querySelector('.delete-btn').addEventListener('click', function(e) {
      e.stopPropagation();
      deleteProject(project.id, project.title);
    });

    return card;
  }

  // ===== Render Empty State =====
  function renderEmptyState() {
    var empty = document.createElement('div');
    empty.className = 'col-span-full flex flex-col items-center justify-center py-16';
    empty.innerHTML =
      '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-bottom: 16px;"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg>' +
      '<p class="text-sm" style="font-family: var(--font-body); color: var(--text-muted);">暂无项目，点击新建</p>';
    return empty;
  }

  // ===== Render Projects =====
  function renderProjects() {
    grid.innerHTML = '';

    // 过滤项目
    var filtered = allProjects.filter(function(p) {
      var matchFilter = currentFilter === 'all' || p.status === currentFilter;
      var matchSearch = !searchQuery || (p.title || '').toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
      return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
      grid.appendChild(renderEmptyState());
      return;
    }

    filtered.forEach(function(project) {
      grid.appendChild(renderProjectCard(project));
    });
  }

  // ===== Load Projects =====
  function loadProjects() {
    db.getProjects()
      .then(function(data) {
        allProjects = data || [];
        renderProjects();
      })
      .catch(function(err) {
        console.error('加载项目失败:', err);
        alert('加载项目失败，请刷新页面重试');
      });
  }

  // ===== Create/Update Modal =====
  function openModal(title, isEdit) {
    var modal = document.createElement('div');
    modal.id = 'project-modal';
    modal.style.cssText = 'position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5);';

    modal.innerHTML =
      '<div style="background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 480px; margin: 16px;">' +
        '<h3 class="text-lg font-semibold mb-4" style="font-family: var(--font-heading); color: var(--text-heading);">' + title + '</h3>' +
        '<form id="project-form">' +
          '<div class="mb-4">' +
            '<label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">标题</label>' +
            '<input type="text" name="title" required class="w-full px-3 py-2 text-sm rounded-md outline-none" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor=\'var(--color-primary)\'; this.style.boxShadow=\'0 0 0 2px var(--color-primary-light)\'" onblur="this.style.borderColor=\'var(--border-default)\'; this.style.boxShadow=\'none\'" />' +
          '</div>' +
          '<div class="mb-4">' +
            '<label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">描述</label>' +
            '<textarea name="description" rows="3" class="w-full px-3 py-2 text-sm rounded-md outline-none resize-none" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor=\'var(--color-primary)\'; this.style.boxShadow=\'0 0 0 2px var(--color-primary-light)\'" onblur="this.style.borderColor=\'var(--border-default)\'; this.style.boxShadow=\'none\'"></textarea>' +
          '</div>' +
          '<div class="mb-4">' +
            '<label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">状态</label>' +
            '<select name="status" class="w-full px-3 py-2 text-sm rounded-md outline-none" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);">' +
              '<option value="ongoing">进行中</option>' +
              '<option value="done">已完成</option>' +
              '<option value="archived">已归档</option>' +
            '</select>' +
          '</div>' +
          '<div class="mb-6">' +
            '<label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-heading);">进度（0-100）</label>' +
            '<input type="number" name="progress" min="0" max="100" value="0" class="w-full px-3 py-2 text-sm rounded-md outline-none" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor=\'var(--color-primary)\'; this.style.boxShadow=\'0 0 0 2px var(--color-primary-light)\'" onblur="this.style.borderColor=\'var(--border-default)\'; this.style.boxShadow=\'none\'" />' +
          '</div>' +
          '<div class="flex justify-end gap-3">' +
            '<button type="button" id="cancel-btn" class="px-4 py-2 text-sm rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-secondary); border: 1px solid var(--border-default);">取消</button>' +
            '<button type="submit" class="px-4 py-2 text-sm font-semibold rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;">保存</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    document.body.appendChild(modal);

    // 绑定取消和关闭
    modal.querySelector('#cancel-btn').addEventListener('click', function() {
      document.body.removeChild(modal);
    });

    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        document.body.removeChild(modal);
      }
    });

    return modal;
  }

  // ===== Open Create Modal =====
  function openCreateModal() {
    editingProjectId = null;
    var modal = openModal('新建项目', false);

    // 提交新建
    modal.querySelector('#project-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var form = e.target;
      var data = {
        title: form.title.value,
        description: form.description.value,
        status: form.status.value,
        progress: parseInt(form.progress.value, 10) || 0
      };

      db.createProject(data)
        .then(function() {
          document.body.removeChild(modal);
          loadProjects();
        })
        .catch(function(err) {
          console.error('创建项目失败:', err);
          alert('创建项目失败，请重试');
        });
    });
  }

  // ===== Open Edit Modal =====
  function openEditModal(project) {
    editingProjectId = project.id;
    var modal = openModal('编辑项目', true);

    // 填充数据
    var form = modal.querySelector('#project-form');
    form.title.value = project.title || '';
    form.description.value = project.description || '';
    form.status.value = project.status || 'ongoing';
    form.progress.value = project.progress || 0;

    // 提交编辑
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var data = {
        title: form.title.value,
        description: form.description.value,
        status: form.status.value,
        progress: parseInt(form.progress.value, 10) || 0
      };

      db.updateProject(editingProjectId, data)
        .then(function() {
          document.body.removeChild(modal);
          loadProjects();
        })
        .catch(function(err) {
          console.error('更新项目失败:', err);
          alert('更新项目失败，请重试');
        });
    });
  }

  // ===== Delete Project =====
  function deleteProject(id, title) {
    if (!confirm('确定要删除项目"' + (title || '未命名') + '"吗？此操作不可撤销。')) {
      return;
    }

    db.deleteProject(id)
      .then(function() {
        loadProjects();
      })
      .catch(function(err) {
        console.error('删除项目失败:', err);
        alert('删除项目失败，请重试');
      });
  }

  // ===== Filter Tabs =====
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) {
        t.removeAttribute('data-active');
        t.style.fontWeight = 'normal';
        t.style.color = 'var(--text-secondary)';
        t.style.background = 'transparent';
        t.style.border = 'none';
        t.style.boxShadow = 'none';
      });
      tab.setAttribute('data-active', 'true');
      tab.style.fontWeight = '600';
      tab.style.color = 'var(--text-inverse)';
      tab.style.background = 'var(--color-primary)';
      currentFilter = tab.getAttribute('data-filter');
      renderProjects();
    });

    // 初始化激活状态
    if (tab.hasAttribute('data-active')) {
      tab.style.fontWeight = '600';
      tab.style.color = 'var(--text-inverse)';
      tab.style.background = 'var(--color-primary)';
    }
  });

  // ===== Search =====
  if (searchInput) {
    searchInput.addEventListener('input', function(e) {
      searchQuery = e.target.value.trim();
      renderProjects();
    });
  }

  // ===== New Project Button =====
  if (newProjectBtn) {
    newProjectBtn.addEventListener('click', function() {
      openCreateModal();
    });
  }

  // ===== Init =====
  loadProjects();
})();
</script>

<script>
(function() {
  var dropdown = document.getElementById('user-dropdown');
  var btn = document.getElementById('user-menu-btn');
  function showUserDropdown() { if (!dropdown) return; dropdown.style.opacity = '1'; dropdown.style.pointerEvents = 'auto'; dropdown.style.transform = 'translateY(0)'; loadBalance(); }
  function closeUserDropdown() { if (!dropdown) return; dropdown.style.opacity = '0'; dropdown.style.pointerEvents = 'none'; dropdown.style.transform = 'translateY(-4px)'; }
  function loadBalance() {
    var el = document.getElementById('user-balance');
    if (!el) return;
    try {
      var config = JSON.parse(localStorage.getItem('ai_config') || '{}');
      if (config.api_key && typeof ai !== 'undefined' && typeof ai.getBalance === 'function') {
        ai.baseURL = config.base_url || ai.baseURL;
        ai.apiKey = config.api_key;
        ai.getBalance().then(function(data) {
          if (!el) return;
          var balance = data.balance !== undefined ? data.balance : (data.data && data.data.balance !== undefined ? data.data.balance : null);
          el.textContent = balance !== null && balance !== undefined ? '¥' + Number(balance).toFixed(2) : '¥0.00';
        }).catch(function() { if (el) el.textContent = '¥0.00'; });
      }
    } catch(e) {}
  }
  if (btn && dropdown) {
    btn.addEventListener('mouseenter', showUserDropdown);
    btn.addEventListener('mouseleave', closeUserDropdown);
    dropdown.addEventListener('mouseenter', function() {});
    dropdown.addEventListener('mouseleave', closeUserDropdown);
    btn.addEventListener('click', function(e) { e.stopPropagation(); if (dropdown.style.opacity === '1') closeUserDropdown(); else showUserDropdown(); });
    document.addEventListener('click', function(e) { if (dropdown.style.opacity === '1' && !dropdown.contains(e.target) && e.target !== btn && !btn.contains(e.target)) closeUserDropdown(); });
  }
  function showLogoutModal() {
    var modal = document.getElementById('logout-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'logout-modal';
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 200ms ease;';
      modal.innerHTML = '<div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:24px;max-width:400px;width:90%;box-shadow:var(--shadow-float);transform:scale(0.95);transition:transform 200ms ease;"><h3 style="font-size:18px;font-weight:600;font-family:var(--font-heading);color:var(--text-heading);margin:0 0 8px 0;">确认退出账号？</h3><p style="font-size:14px;font-family:var(--font-body);color:var(--text-secondary);margin:0 0 24px 0;line-height:1.6;">退出后您的会话数据和本地配置将被清除，下次登录需要重新配置。</p><div style="display:flex;gap:12px;justify-content:flex-end;"><button id="logout-cancel" style="padding:10px 20px;border-radius:var(--radius-md);border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-body);font-size:14px;font-family:var(--font-heading);cursor:pointer;transition:background-color 150ms ease;" onmouseover="this.style.backgroundColor=\'var(--surface-hover)\'" onmouseout="this.style.backgroundColor=\'var(--surface-card)\'">取消</button><button id="logout-confirm" style="padding:10px 20px;border-radius:var(--radius-md);border:none;background:#ef4444;color:#fff;font-size:14px;font-family:var(--font-heading);cursor:pointer;transition:opacity 150ms ease;" onmouseover="this.style.opacity=\'0.9\'" onmouseout="this.style.opacity=\'1\'">确认退出</button></div></div>';
      document.body.appendChild(modal);
      modal.querySelector('#logout-cancel').addEventListener('click', function() { hideLogoutModal(); });
      modal.querySelector('#logout-confirm').addEventListener('click', function() {
        localStorage.removeItem('ai_config');
        localStorage.removeItem('user_name');
        localStorage.removeItem('user_id');
        localStorage.removeItem('nav_favorites');
        hideLogoutModal();
        if (window.awShowToast) window.awShowToast('已退出账号');
        setTimeout(function() { window.location.href = 'index.html'; }, 500);
      });
      modal.addEventListener('click', function(e) { if (e.target === modal) hideLogoutModal(); });
    }
    requestAnimationFrame(function() { modal.style.opacity = '1'; modal.style.pointerEvents = 'auto'; modal.querySelector('div').style.transform = 'scale(1)'; });
  }
  function hideLogoutModal() {
    var modal = document.getElementById('logout-modal');
    if (!modal) return;
    modal.style.opacity = '0';
    modal.style.pointerEvents = 'none';
    modal.querySelector('div').style.transform = 'scale(0.95)';
  }
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { hideLogoutModal(); closeUserDropdown(); } });
})();
</script>
</body>
</html>
