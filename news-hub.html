<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>资讯台 — OK AI ART</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-primary: var(--color-primary);
      --color-secondary: var(--color-secondary);
    }
    @layer base {
      body { background: var(--surface-bg); color: var(--text-body); }
    }
  </style>
  <style>
    .news-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 15, 20, 0.7);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease;
    }
    .news-modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .news-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 101;
      width: 90%;
      max-width: 720px;
      max-height: 85vh;
      background-color: var(--surface-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-float);
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease, transform 250ms ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .news-modal.is-open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .news-modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: flex-start;
      gap: 16px;
      flex-shrink: 0;
    }
    .news-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .news-modal-close {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .news-modal-close:hover {
      background-color: var(--surface-hover);
      color: var(--text-heading);
    }
    .news-content {
      line-height: 1.8;
      font-size: 14px;
      color: var(--text-body);
    }
    .news-content p {
      margin-bottom: 16px;
    }
    .news-content strong {
      color: var(--text-heading);
      font-weight: 600;
    }
    .news-content ul, .news-content ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }
    .news-content li {
      margin-bottom: 8px;
    }
    .news-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased" data-page="news-hub" style="font-family: var(--font-body); color: var(--text-body); background-color: var(--surface-bg);">

<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">

    <!-- Header Center: Search -->
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">

      </div>
    </div>

    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题">

        <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="product" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">产品更新</button>
      </div>

      <!-- News Grid -->
      <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      </div>

    </div>
  </main>

</div>

<!-- News Modal -->
<div id="news-modal-backdrop" class="news-modal-backdrop"></div>
<div id="news-modal" class="news-modal" role="dialog" aria-modal="true" aria-labelledby="news-modal-title">
  <div class="news-modal-header">
    <div class="flex-1 min-w-0">
      <span id="news-modal-category" class="inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md whitespace-nowrap mb-2" style="font-family: var(--font-heading);"></span>
      <h3 id="news-modal-title" class="text-lg font-semibold" style="font-family: var(--font-heading); color: var(--text-heading); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;"></h3>
      <p id="news-modal-date" class="text-xs mt-1" style="font-family: var(--font-heading); color: var(--text-muted);"></p>
    </div>
    <button id="news-modal-close" class="news-modal-close" aria-label="关闭">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="news-modal-body" class="news-modal-body">
    <div id="news-modal-content" class="news-content"></div>
  </div>
</div>

    var allNews = [];

    var tabs = document.querySelectorAll('.filter-tab');
    var searchInput = document.getElementById('news-search-input');

    var modalBackdrop = document.getElementById('news-modal-backdrop');
    var modal = document.getElementById('news-modal');
    var modalClose = document.getElementById('news-modal-close');
    var modalTitle = document.getElementById('news-modal-title');
    var modalCategory = document.getElementById('news-modal-category');
    var modalDate = document.getElementById('news-modal-date');
    var modalContent = document.getElementById('news-modal-content');

    function getCategoryColor(category) {
      switch (category) {
        case 'product':
          return { bg: 'rgba(139, 92, 246, 0.10)', color: 'var(--color-primary)' };
        case 'tutorial':
          return { bg: 'rgba(106, 155, 204, 0.08)', color: '#6a9bcc' };
        case 'industry':
          return { bg: 'rgba(120, 140, 93, 0.08)', color: '#788c5d' };
        default:
          return { bg: 'rgba(139, 92, 246, 0.10)', color: 'var(--color-primary)' };
      }
    }

    function renderNewsCard(news) {
      var colors = getCategoryColor(news.category);
      var card = document.createElement('div');
      card.className = 'news-card rounded-lg overflow-hidden transition-all duration-200';
      card.setAttribute('data-category', news.category);
      card.setAttribute('data-id', news.id);
      card.style.backgroundColor = 'var(--surface-card)';
      card.style.border = '1px solid var(--border-default)';
      card.style.display = 'flex';
      card.style.flexDirection = 'column';

      var coverImg = news.cover_image || 'assets/image_1_yi19x4.jpg';

      var coverDiv = document.createElement('div');
      coverDiv.className = 'overflow-hidden';
      coverDiv.style.height = '160px';
      coverDiv.style.backgroundColor = 'var(--surface-inset)';
      coverDiv.style.flexShrink = '0';

      var img = document.createElement('img');
      img.src = coverImg;
      img.alt = news.title;
      img.className = 'w-full h-full object-cover';
      img.onerror = function() {
        this.src = 'assets/image_1_yi19x4.jpg';
      };
      coverDiv.appendChild(img);
      card.appendChild(coverDiv);

      var contentDiv = document.createElement('div');
      contentDiv.className = 'p-5 flex flex-col flex-1';

      var categorySpan = document.createElement('span');
      categorySpan.className = 'inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md whitespace-nowrap mb-2 self-start';
      categorySpan.style.fontFamily = 'var(--font-heading)';
      categorySpan.style.backgroundColor = colors.bg;
      categorySpan.style.color = colors.color;
      categorySpan.textContent = news.category_label;
      contentDiv.appendChild(categorySpan);

      var titleH4 = document.createElement('h4');
      titleH4.className = 'text-sm font-semibold mb-1.5';
      titleH4.style.fontFamily = 'var(--font-heading)';
      titleH4.style.color = 'var(--text-heading)';
      titleH4.style.display = '-webkit-box';
      titleH4.style.webkitLineClamp = '2';
      titleH4.style.webkitBoxOrient = 'vertical';
      titleH4.style.overflow = 'hidden';
      titleH4.textContent = news.title;
      contentDiv.appendChild(titleH4);

      var summaryP = document.createElement('p');
      summaryP.className = 'text-xs mb-4 flex-1';
      summaryP.style.fontFamily = 'var(--font-body)';
      summaryP.style.color = 'var(--text-secondary)';
      summaryP.style.display = '-webkit-box';
      summaryP.style.webkitLineClamp = '3';
      summaryP.style.webkitBoxOrient = 'vertical';
      summaryP.style.overflow = 'hidden';
      summaryP.textContent = news.summary;
      contentDiv.appendChild(summaryP);

      var footerDiv = document.createElement('div');
      footerDiv.className = 'flex items-center justify-between mt-auto pt-3';
      footerDiv.style.borderTop = '1px solid var(--border-default)';

      var dateSpan = document.createElement('span');
      dateSpan.className = 'text-xs';
      dateSpan.style.fontFamily = 'var(--font-heading)';
      dateSpan.style.color = 'var(--text-muted)';
      dateSpan.textContent = news.published_at;
      footerDiv.appendChild(dateSpan);

      var readBtn = document.createElement('button');
      readBtn.className = 'news-read-btn text-xs font-medium cursor-pointer transition-colors duration-150 flex items-center gap-1';
      readBtn.setAttribute('data-id', news.id);
      readBtn.style.fontFamily = 'var(--font-heading)';
      readBtn.style.color = 'var(--color-primary)';
      readBtn.style.background = 'none';
      readBtn.style.border = 'none';
      readBtn.style.padding = '0';
      readBtn.addEventListener('mouseenter', function() {
        this.style.color = 'var(--color-primary-hover)';
      });
      readBtn.addEventListener('mouseleave', function() {
        this.style.color = 'var(--color-primary)';
      });
      readBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        openNewsModal(news.id);
      });

      var btnText = document.createElement('span');
      btnText.textContent = '阅读全文';
      readBtn.appendChild(btnText);

      var arrowSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      arrowSvg.setAttribute('width', '12');
      arrowSvg.setAttribute('height', '12');
      arrowSvg.setAttribute('viewBox', '0 0 24 24');
      arrowSvg.setAttribute('fill', 'none');
      arrowSvg.setAttribute('stroke', 'currentColor');
      arrowSvg.setAttribute('stroke-width', '2');
      arrowSvg.setAttribute('stroke-linecap', 'round');
      arrowSvg.setAttribute('stroke-linejoin', 'round');
      var path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path1.setAttribute('d', 'M5 12h14');
      var path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path2.setAttribute('d', 'm12 5 7 7-7 7');
      arrowSvg.appendChild(path1);
      arrowSvg.appendChild(path2);
      readBtn.appendChild(arrowSvg);

      footerDiv.appendChild(readBtn);
      contentDiv.appendChild(footerDiv);
      card.appendChild(contentDiv);

      card.addEventListener('mouseenter', function () {
        this.style.borderColor = 'var(--color-primary)';
        this.style.transform = 'translateY(-2px)';
        this.style.boxShadow = 'var(--shadow-elevated)';
      });
      card.addEventListener('mouseleave', function () {
        this.style.borderColor = 'var(--border-default)';
        this.style.transform = 'translateY(0)';
        this.style.boxShadow = 'none';
      });

      return card;
    }

    function renderEmptyState() {
      var empty = document.createElement('div');
      empty.className = 'news-empty col-span-full';
      empty.style.gridColumn = '1 / -1';
      empty.style.textAlign = 'center';
      empty.style.padding = '60px 20px';

      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '48');
      svg.setAttribute('height', '48');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.5');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.style.margin = '0 auto 16px';
      svg.style.opacity = '0.5';
      svg.style.color = 'var(--text-muted)';

      var path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path1.setAttribute('d', 'M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2');
      var path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path2.setAttribute('d', 'M18 14h-8');
      var path3 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path3.setAttribute('d', 'M15 18h-5');
      var path4 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path4.setAttribute('d', 'M10 6h8v4h-8V6Z');
      svg.appendChild(path1);
      svg.appendChild(path2);
      svg.appendChild(path3);
      svg.appendChild(path4);
      empty.appendChild(svg);

      var p1 = document.createElement('p');
      p1.style.fontFamily = 'var(--font-heading)';
      p1.style.fontSize = '14px';
      p1.style.color = 'var(--text-muted)';
      p1.textContent = '暂无相关资讯';
      empty.appendChild(p1);

      var p2 = document.createElement('p');
      p2.style.fontSize = '12px';
      p2.style.marginTop = '4px';
      p2.style.color = 'var(--text-muted)';
      p2.textContent = '试试其他关键词或分类';
      empty.appendChild(p2);

      newsGrid.appendChild(empty);
    }

    function renderNewsList(newsList) {
      newsGrid.innerHTML = '';

      if (newsList.length === 0) {
        renderEmptyState();
        return;
      }

      newsList.forEach(function (news) {
        var card = renderNewsCard(news);
        newsGrid.appendChild(card);
      });
    }

    function filterAndRender() {
      var filtered = allNews.filter(function (item) {
        var matchCategory = currentFilter === 'all' || item.category === currentFilter;
        var matchSearch = !currentSearch ||
          item.title.toLowerCase().includes(currentSearch.toLowerCase());
        return matchCategory && matchSearch;
      });

      filtered.sort(function (a, b) {
        return new Date(b.published_at) - new Date(a.published_at);
      });

      renderNewsList(filtered);
    }

    function initTabs() {
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.removeAttribute('data-active');
            t.style.fontWeight = 'normal';
            t.style.color = 'var(--text-secondary)';
            t.style.background = 'transparent';
            t.style.border = 'none';
            t.style.boxShadow = 'none';
          });
          tab.setAttribute('data-active', 'true');
          currentFilter = tab.getAttribute('data-filter');
          filterAndRender();
        });
      });
    }

    function initSearch() {
      var searchTimeout;
      searchInput.addEventListener('input', function (e) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function () {
          currentSearch = e.target.value.trim();
          filterAndRender();
        }, 200);
      });

      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          currentSearch = e.target.value.trim();
          filterAndRender();
        }
      });
    }

    function formatContent(content) {
      var lines = content.split('\n');
      var html = '';
      var inList = false;
      var listType = '';

      lines.forEach(function (line) {
        line = line.trim();
        if (!line) {
          if (inList) {
            html += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          return;
        }

        if (line.startsWith('- ') || line.startsWith('* ')) {
          if (!inList || listType !== 'ul') {
            if (inList) html += listType === 'ul' ? '</ul>' : '</ol>';
            html += '<ul>';
            inList = true;
            listType = 'ul';
          }
          html += '<li>' + formatInline(line.substring(2)) + '</li>';
        } else if (/^\d+\.\s/.test(line)) {
          if (!inList || listType !== 'ol') {
            if (inList) html += listType === 'ul' ? '</ul>' : '</ol>';
            html += '<ol>';
            inList = true;
            listType = 'ol';
          }
          html += '<li>' + formatInline(line.replace(/^\d+\.\s/, '')) + '</li>';
        } else {
          if (inList) {
            html += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
          }
          if (line.startsWith('**') && line.endsWith('**')) {
            html += '<p><strong>' + formatInline(line.slice(2, -2)) + '</strong></p>';
          } else {
            html += '<p>' + formatInline(line) + '</p>';
          }
        }
      });

      if (inList) {
        html += listType === 'ul' ? '</ul>' : '</ol>';
      }

      return html;
    }

    function formatInline(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    function openNewsModal(id) {
      var news = allNews.find(function (item) {
        return item.id === parseInt(id);
      });
      if (!news) return;

      var colors = getCategoryColor(news.category);
      modalCategory.textContent = news.category_label;
      modalCategory.style.backgroundColor = colors.bg;
      modalCategory.style.color = colors.color;

      modalTitle.textContent = news.title;
      modalDate.textContent = news.published_at + ' · 阅读 ' + (news.views || 0) + ' 次';
      modalContent.innerHTML = formatContent(news.content);

      modalBackdrop.classList.add('is-open');
      modal.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    function closeNewsModal() {
      modalBackdrop.classList.remove('is-open');
      modal.classList.remove('is-open');
      document.body.style.overflow = '';
    }

    function initModal() {
      modalClose.addEventListener('click', closeNewsModal);
      modalBackdrop.addEventListener('click', closeNewsModal);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) {
          closeNewsModal();
        }
      });
    }

    function init() {
      db.getNews().then(function (news) {
        allNews = news || [];
        filterAndRender();
      });

      initTabs();
      initSearch();
      initModal();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
</body>
</html>
