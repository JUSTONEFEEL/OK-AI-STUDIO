      <li><a href="ai-employees.html" data-nav-key="ai-employees" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>AI员工</span></a></li>
      <li><a href="news-hub.html" data-nav-key="news-hub" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg><span>资讯台</span></a></li>

      <li><a href="creative-studio.html" data-nav-key="creative-studio" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg><span>创作工坊</span></a></li>
      <li><a href="projects.html" data-nav-key="projects" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg><span>项目中心</span></a></li>

      <li><a href="settings.html" data-nav-key="settings" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></a></li>
    </ul>
  </nav>
  <div class="px-4 py-4 border-t" style="border-color: var(--border-default);">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center flex-shrink-0 text-xs font-semibold" style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading);">U</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium truncate" style="font-family: var(--font-heading); color: var(--text-heading);">创作者</p>
        <p class="text-xs truncate" style="color: var(--text-muted);">专业版</p>
      </div>
    </div>

</aside>

<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">
  <header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6 border-b gap-3" style="background-color: var(--surface-card); border-color: var(--border-default);">
    <div class="flex items-center gap-3 min-w-0">
      <button id="menu-toggle" class="menu-toggle items-center justify-center p-2 rounded-md" style="color: var(--text-secondary); display:none;" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="header-page-title text-lg font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">新建AI员工</h1>
    </div>
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" data-role="search" placeholder="搜索..." class="w-full pl-9 pr-4 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
      </div>
    </div>
    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题"><svg data-theme-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg data-theme-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg></button>
      <div class="relative">
        <button id="notif-btn" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="通知"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="absolute top-1.5 right-1.5" style="width: 7px; height: 7px; background-color: var(--color-primary); border-radius: var(--radius-full);"></span></button>
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--color-primary);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">表单未保存</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">记得在离开前保存配置</p></div></div>
        </div>
      </div>
      <button class="flex items-center justify-center flex-shrink-0" style="width: 34px; height: 34px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 13px; font-weight: 600; transition: background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--color-primary)'; this.style.color='var(--text-inverse)'" onmouseout="this.style.backgroundColor='var(--color-primary-light)'; this.style.color='var(--color-primary)'" aria-label="用户菜单">U</button>
    </div>
  </header>

  <main class="flex-1" style="background-color: var(--surface-bg);">
    <div class="p-4 sm:p-6 lg:p-8">

      <!-- Breadcrumb + Title -->
      <div class="mb-8">
        <nav class="flex items-center gap-2 mb-4" aria-label="面包屑">
          <a href="ai-employees.html" class="text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--color-primary);" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">AI员工</a>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><polyline points="9 18 15 12 9 6"/></svg>
          <span class="text-sm" style="font-family: var(--font-heading); color: var(--text-muted);">新建AI员工</span>
        </nav>
        <h2 class="text-2xl font-semibold" style="font-family: var(--font-heading); color: var(--text-heading); text-wrap: balance; word-break: keep-all;">新建AI员工</h2>
        <p class="mt-1 text-sm" style="font-family: var(--font-body); color: var(--text-secondary);">配置你的AI员工的能力、技能文件和参数</p>
      </div>

      <!-- Form Container -->
      <form id="create-employee-form" class="mx-auto" style="max-width: 768px;">

        <!-- ===== Section 1: 基本信息 ===== -->
        <div class="mb-6 rounded-lg" style="background-color: var(--surface-card); border: 1px solid var(--border-default); padding: 24px;">
          <h3 class="text-base font-semibold mb-5" style="font-family: var(--font-heading); color: var(--text-heading);">基本信息</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-secondary);">AI员工名称</label>
              <input id="emp-name" name="name" type="text" placeholder="例如：视频导演AI" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-bg); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-secondary);">角色类型</label>
              <select name="role" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150 appearance-none" style="font-family: var(--font-body); background-color: var(--surface-bg); color: var(--text-body); border: 1px solid var(--border-default); background-image: url('data:image/svg+xml,<svg width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239ca3af%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 xmlns=%22http://www.w3.org/2000/svg%22><polyline points=%226 9 12 15 18 9%22/></svg>'); background-repeat: no-repeat; background-position: right 12px center;" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'">
                <option value="">选择角色</option>
                <option value="director">导演</option>
                <option value="design">设计</option>
                <option value="generate">生成</option>
                <option value="screenwriter">编剧</option>
                <option value="audio">音频</option>
                <option value="vfx">特效</option>
                <option value="custom">自定义</option>
              </select>
            </div>
          </div>
          <div class="mt-5">
            <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-secondary);">描述</label>
            <textarea name="description" rows="3" placeholder="描述这个AI员工的职责和能力..." class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150 resize-none" style="font-family: var(--font-body); background-color: var(--surface-bg); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'"></textarea>
          </div>
          <div class="mt-5">
            <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-secondary);">头像设置</label>
            <div class="flex items-center gap-4">
              <div id="avatar-preview" class="flex items-center justify-center flex-shrink-0" style="width: 56px; height: 56px; background-color: var(--surface-inset); border-radius: var(--radius-full); border: 1px dashed var(--border-default);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <label class="flex items-center justify-center rounded-md cursor-pointer transition-colors duration-150" style="padding: 8px 16px; border: 1px dashed var(--border-default); background-color: var(--surface-bg);" onmouseover="this.style.borderColor='var(--border-strong)'" onmouseout="this.style.borderColor='var(--border-default)'">
                <span class="text-sm" style="font-family: var(--font-heading); color: var(--text-secondary);">上传头像</span>
                <input type="file" accept="image/*" style="display:none;" id="avatar-input" />
              </label>
            </div>
          </div>
        </div>

        <!-- ===== Section 2: 技能标签 ===== -->
        <div class="mb-6 rounded-lg" style="background-color: var(--surface-card); border: 1px solid var(--border-default); padding: 24px;">
          <h3 class="text-base font-semibold mb-5" style="font-family: var(--font-heading); color: var(--text-heading);">技能标签</h3>
          <div>
            <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-secondary);">技能标签</label>
            <input id="emp-skills" name="skills" type="text" placeholder="例如：视频剪辑, 分镜设计, 后期特效（逗号分隔）" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-bg); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
            <p class="mt-2 text-xs" style="font-family: var(--font-body); color: var(--text-muted);">多个技能请用逗号分隔，保存后将存入 skills 字段</p>
          </div>
        </div>

        <!-- ===== Section 3: 模型配置 ===== -->
        <div class="mb-6 rounded-lg" style="background-color: var(--surface-card); border: 1px solid var(--border-default); padding: 24px;">
          <h3 class="text-base font-semibold mb-5" style="font-family: var(--font-heading); color: var(--text-heading);">模型配置</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div>
              <label class="block text-sm font-medium mb-1.5" style="font-family: var(--font-heading); color: var(--text-secondary);">默认生图模型</label>

              <span class="absolute top-0.5 rounded-full transition-transform duration-150" style="width: 20px; height: 20px; background-color: #fff; left: 22px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);"></span>

        <!-- ===== Bottom Actions ===== -->

          <a href="ai-employees.html" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: transparent; color: var(--text-secondary); border: 1px solid var(--border-default); text-decoration:none;" onmouseover="this.style.borderColor='var(--border-strong)'; this.style.color='var(--text-heading)'" onmouseout="this.style.borderColor='var(--border-default)'; this.style.color='var(--text-secondary)'">取消</a>
          <button type="submit" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;" onmouseover="this.style.backgroundColor='var(--color-primary-hover)'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='var(--color-primary)'; this.style.transform='translateY(0)'" onmousedown="this.style.transform='translateY(0)'">创建AI员工</button>

<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
<script>
  // ===== Toggle switch =====
  function toggleSwitch(btn) {
    var knob = btn.querySelector('span');
    var isOn = btn.getAttribute('aria-checked') === 'true';
    if (isOn) {
      btn.setAttribute('aria-checked', 'false');
      btn.style.backgroundColor = 'var(--border-strong)';
      knob.style.left = '2px';
    } else {
      btn.setAttribute('aria-checked', 'true');
      btn.style.backgroundColor = 'var(--color-primary)';
      knob.style.left = '22px';
    }
  }

  // ===== Avatar upload preview (local only, needs manual upload later) =====
  (function () {
    var input = document.getElementById('avatar-input');
    var preview = document.getElementById('avatar-preview');
    if (!input || !preview) return;
    input.addEventListener('change', function () {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function (e) {
          preview.innerHTML = '<img src="' + e.target.result + '" alt="头像预览" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius-full);" />';
          window.awShowToast && window.awShowToast('头像已预览（仅本地），需要手动上传到服务器');
        };
        reader.readAsDataURL(input.files[0]);
      }
    });
  })();

  // ===== Form submit - real Supabase write =====
  (function () {
    var form = document.getElementById('create-employee-form');
    if (!form) return;

    var nameInput = document.getElementById('emp-name');
    var roleSelect = form.querySelector('select[name="role"]');
    var descTextarea = form.querySelector('textarea[name="description"]');
    var skillsInput = document.getElementById('emp-skills');
    var avatarPreview = document.getElementById('avatar-preview');
    var submitBtn = form.querySelector('button[type="submit"]');
    var pageTitle = document.querySelector('.header-page-title');
    var breadcrumbCurrent = document.querySelector('nav[aria-label="面包屑"] span');
    var sectionTitle = document.querySelector('h2.text-2xl');
    var sectionSubtitle = document.querySelector('h2.text-2xl + p');

    var urlParams = new URLSearchParams(window.location.search);
    var editId = urlParams.get('id');
    var isEditMode = !!editId;

    if (isEditMode) {
      if (pageTitle) pageTitle.textContent = '编辑AI员工';
      if (breadcrumbCurrent) breadcrumbCurrent.textContent = '编辑AI员工';
      if (sectionTitle) sectionTitle.textContent = '编辑AI员工';
      if (sectionSubtitle) sectionSubtitle.textContent = '修改AI员工的配置和参数';
      if (submitBtn) submitBtn.textContent = '保存修改';

      if (typeof db !== 'undefined') {
        db.getEmployee(editId)
          .then(function (data) {
            var emp = data && data[0] ? data[0] : null;
            if (emp) {
              if (nameInput) nameInput.value = emp.name || '';
              if (roleSelect) roleSelect.value = emp.role || '';
              if (descTextarea) descTextarea.value = emp.description || '';
              if (skillsInput && emp.skills && Array.isArray(emp.skills)) {
                skillsInput.value = emp.skills.join(', ');
              }
              if (avatarPreview && emp.avatar_url) {
                avatarPreview.innerHTML = '<img src="' + emp.avatar_url + '" alt="头像预览" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius-full);" />';
              }
            }
          })
          .catch(function (err) {
            console.error('Load employee error:', err);
            window.awShowToast && window.awShowToast('加载失败：' + (err.message || '网络错误'));
          });
      }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!nameInput.value.trim()) {
        nameInput.style.borderColor = 'var(--state-error)';
        nameInput.style.boxShadow = '0 0 0 2px rgba(239,68,68,0.18)';
        nameInput.focus();
        window.awShowToast && window.awShowToast('请填写AI员工名称');
        setTimeout(function () {
          nameInput.style.borderColor = 'var(--border-default)';
          nameInput.style.boxShadow = 'none';
        }, 2000);
        return;
      }

      if (!roleSelect.value) {
        roleSelect.style.borderColor = 'var(--state-error)';
        roleSelect.style.boxShadow = '0 0 0 2px rgba(239,68,68,0.18)';
        roleSelect.focus();
        window.awShowToast && window.awShowToast('请选择角色类型');
        setTimeout(function () {
          roleSelect.style.borderColor = 'var(--border-default)';
          roleSelect.style.boxShadow = 'none';
        }, 2000);
        return;
      }

      var skillsArray = [];
      if (skillsInput.value.trim()) {
        skillsArray = skillsInput.value.split(',').map(function (s) {
          return s.trim();
        }).filter(function (s) {
          return s.length > 0;
        });
      }

      var avatarUrl = null;
      var avatarImg = avatarPreview.querySelector('img');
      if (avatarImg) {
        avatarUrl = avatarImg.src;
      }

      var employeeData = {
        name: nameInput.value.trim(),
        role: roleSelect.value,
        description: descTextarea.value.trim() || null,
        skills: skillsArray.length > 0 ? skillsArray : null,
        avatar_url: avatarUrl
      };

      var originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = isEditMode ? '保存中...' : '创建中...';

      try {
        var result;
        if (isEditMode) {
          result = await db.updateEmployee(editId, employeeData);
          if (result && result.length > 0) {
            window.awShowToast && window.awShowToast('AI员工更新成功');
            setTimeout(function () {
              window.location.href = 'ai-employees.html';
            }, 900);
          } else {
            window.awShowToast && window.awShowToast('更新失败，请重试');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        } else {
          employeeData.status = 'active';
          result = await db.createEmployee(employeeData);
          if (result && result.length > 0) {
            window.awShowToast && window.awShowToast('AI员工创建成功');
            setTimeout(function () {
              window.location.href = 'ai-employees.html';
            }, 900);
          } else {
            window.awShowToast && window.awShowToast('创建失败，请重试');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        }
      } catch (error) {
        console.error(isEditMode ? 'Update employee error:' : 'Create employee error:', error);
        window.awShowToast && window.awShowToast((isEditMode ? '更新失败：' : '创建失败：') + (error.message || '网络错误'));
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });
  })();
</script>
</body>
</html>
