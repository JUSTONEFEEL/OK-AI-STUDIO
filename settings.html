<script src="assets/js/db.js"></script>
<script src="assets/js/ai.js?v=2"></script>
<script src="assets/js/app.js?v=2"></script>
<script>
  // ===== API Config Logic =====
  (function () {
    var baseUrlInput = document.getElementById('api-base-url');
    var apiKeyInput = document.getElementById('api-key');
    var toggleBtn = document.getElementById('toggle-api-key');
    var eyeIcon = document.getElementById('eye-icon');
    var eyeOffIcon = document.getElementById('eye-off-icon');
    var statusIcon = document.getElementById('api-status-icon');
    var statusText = document.getElementById('api-status-text');
    var saveBtn = document.getElementById('save-api-config');
    var testBtn = document.getElementById('test-api-config');
    var balanceDisplay = document.getElementById('balance-display');
    var balanceAmount = document.getElementById('balance-amount');

    var DEFAULT_BASE_URL = 'https://api.lk888.ai';

    function updateStatus(configured) {
      if (configured) {
        statusIcon.style.backgroundColor = 'var(--state-success)';
        statusText.textContent = '已配置';
        statusText.style.color = 'var(--state-success)';
      } else {
        statusIcon.style.backgroundColor = 'var(--text-muted)';
        statusText.textContent = '未配置';
        statusText.style.color = 'var(--text-secondary)';
      }
    }

    function setButtonLoading(btn, loading, originalText) {
      if (loading) {
        btn.disabled = true;
        btn.style.opacity = '0.6';
        btn.style.cursor = 'not-allowed';
        btn.setAttribute('data-original-text', btn.textContent);
        btn.textContent = '处理中...';
      } else {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
        var orig = btn.getAttribute('data-original-text') || originalText;
        btn.textContent = orig;
      }
    }

    function formatBalance(data) {
      if (!data) return '¥0.00';
      var balance = data.balance !== undefined ? data.balance : (data.data && data.data.balance !== undefined ? data.data.balance : null);
      if (balance === null || balance === undefined) {
        if (typeof data === 'number') return '¥' + data.toFixed(2);
        return '¥0.00';
      }
      return '¥' + Number(balance).toFixed(2);
    }

    function syncBalanceToDropdown(balanceText) {
      var dropdownBalance = document.getElementById('user-balance-personal');
      if (dropdownBalance) dropdownBalance.textContent = balanceText;
    }

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function () {
        if (!apiKeyInput) return;
        var isPassword = apiKeyInput.type === 'password';
        apiKeyInput.type = isPassword ? 'text' : 'password';
        if (eyeIcon) eyeIcon.style.display = isPassword ? 'none' : 'block';
        if (eyeOffIcon) eyeOffIcon.style.display = isPassword ? 'block' : 'none';
      });
    }

    async function loadBalance() {
      try {
        if (typeof ai !== 'undefined' && typeof ai.getBalance === 'function') {
          var data = await ai.getBalance();
          var text = formatBalance(data);
          if (balanceAmount) balanceAmount.textContent = text;
          syncBalanceToDropdown(text);
        } else {
          if (balanceAmount) balanceAmount.textContent = '¥0.00';
          syncBalanceToDropdown('¥0.00');
        }
      } catch (e) {
        console.warn('Failed to load balance:', e);
        if (balanceAmount) balanceAmount.textContent = '¥0.00';
        syncBalanceToDropdown('¥0.00');
      }
    }

    async function loadConfig() {
      try {
        if (typeof ai !== 'undefined') {
          var config = await ai.init();
          if (config) {
            if (baseUrlInput && config.base_url) baseUrlInput.value = config.base_url;
            if (apiKeyInput && config.api_key) apiKeyInput.value = config.api_key;
            updateStatus(config.api_key && config.api_key.length > 0);
            if (config.api_key) loadBalance();
          } else {
            if (baseUrlInput) baseUrlInput.value = DEFAULT_BASE_URL;
            updateStatus(false);
            if (balanceAmount) balanceAmount.textContent = '¥0.00';
          }
        } else {
          console.warn('ai not available');
          if (baseUrlInput) baseUrlInput.value = DEFAULT_BASE_URL;
          if (balanceAmount) balanceAmount.textContent = '¥0.00';
        }
      } catch (e) {
        console.warn('Failed to load API config:', e);
        if (baseUrlInput) baseUrlInput.value = DEFAULT_BASE_URL;
        if (balanceAmount) balanceAmount.textContent = '¥0.00';
      }
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', async function () {
        var baseUrl = baseUrlInput ? baseUrlInput.value.trim() : '';
        var apiKey = apiKeyInput ? apiKeyInput.value.trim() : '';

        if (!apiKey) {
          if (window.awShowToast) window.awShowToast('请输入 API Key');
          return;
        }

        var config = {
          base_url: baseUrl || DEFAULT_BASE_URL,
          api_key: apiKey
        };

        setButtonLoading(saveBtn, true, '保存');

        try {
          if (typeof saveAIConfig === 'function') {
            var success = await saveAIConfig(config);
            if (success) {
              updateStatus(true);
              if (typeof ai !== 'undefined') {
                ai.config = config;
              }
              loadBalance();
              if (window.awShowToast) window.awShowToast('API 配置已保存');
            } else {
              throw new Error('保存失败');
            }
          } else if (typeof db !== 'undefined') {
            await db.upsertSetting('api_config', config);
            updateStatus(true);
            if (typeof ai !== 'undefined') {
              ai.config = config;
            }
            loadBalance();
            if (window.awShowToast) window.awShowToast('API 配置已保存');
          } else {
            throw new Error('存储服务不可用');
          }
        } catch (e) {
          console.error('Failed to save API config:', e);
          if (window.awShowToast) window.awShowToast('保存失败：' + e.message);
        } finally {
          setButtonLoading(saveBtn, false, '保存');
        }
      });
    }

    if (testBtn) {
      testBtn.addEventListener('click', async function () {
        var baseUrl = baseUrlInput ? baseUrlInput.value.trim() : '';
        var apiKey = apiKeyInput ? apiKeyInput.value.trim() : '';

        if (!apiKey) {
          if (window.awShowToast) window.awShowToast('请先输入 API Key');
          return;
        }

        setButtonLoading(testBtn, true, '测试连接');
        if (balanceDisplay) balanceDisplay.style.display = 'none';

        var tempConfig = {
          base_url: baseUrl || DEFAULT_BASE_URL,
          api_key: apiKey
        };

        var originalConfig = null;
        if (typeof ai !== 'undefined') {
          originalConfig = ai.config;
          ai.config = tempConfig;
        }

        try {
          if (typeof ai !== 'undefined' && typeof ai.getBalance === 'function') {
            var data = await ai.getBalance();
            updateStatus(true);
            if (balanceAmount) {
              var text = formatBalance(data);
              balanceAmount.textContent = text;
              syncBalanceToDropdown(text);
            }
            if (window.awShowToast) window.awShowToast('连接成功');
          } else {
            throw new Error('AI 服务未初始化');
          }
        } catch (e) {
          console.error('Failed to test API connection:', e);
          if (originalConfig && typeof ai !== 'undefined') {
            ai.config = originalConfig;
          }
          if (window.awShowToast) window.awShowToast('连接失败：' + e.message);
        } finally {
          setButtonLoading(testBtn, false, '测试连接');
        }
      });
    }

    loadConfig();
  })();


</script>

</body>
</html>
