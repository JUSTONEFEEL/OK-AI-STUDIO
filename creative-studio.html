<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>创作工坊 — OK AI ART</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline { --color-primary: var(--color-primary); --color-secondary: var(--color-secondary); }
    @layer base { body { background: var(--surface-bg); color: var(--text-body); } }
  </style>
  <style>
    .tab-btn { transition: all 0.2s ease; }
    .tab-btn.active { background-color: var(--color-primary); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .generating { opacity: 0.6; pointer-events: none; }
    @keyframes pulse-border { 0%, 100% { border-color: var(--color-primary); } 50% { border-color: transparent; } }
    .generating-pulse { animation: pulse-border 1.5s infinite; }
  </style>
</head>
<body class="min-h-screen font-sans antialiased" data-page="creative-studio" style="font-family: var(--font-body); color: var(--text-body); background-color: var(--surface-bg);">

<div id="app-backdrop" class="app-backdrop"></div>

<!-- ===== LEFT SIDEBAR ===== -->
<aside id="app-sidebar" class="app-sidebar fixed top-0 left-0 z-30 flex flex-col h-screen border-r"
  style="width: var(--sidebar-width); background-color: var(--surface-inset); border-color: var(--border-default);">
  <div class="flex items-center gap-3 px-5 h-16 border-b" style="border-color: var(--border-default);">
    <div class="flex items-center justify-center flex-shrink-0" style="width: 32px; height: 32px; background-color: var(--color-primary); border-radius: var(--radius-md);">
      <img src="assets/logo.svg" alt="OK AI ART" style="width: 20px; height: 20px;" />
    </div>
    <span class="text-sm font-semibold tracking-tight" style="font-family: var(--font-heading); color: var(--text-heading);">OK AI ART</span>
  </div>
  <nav class="flex-1 overflow-y-auto py-4 px-3">
    <ul class="flex flex-col gap-1" style="list-style: none; margin: 0; padding: 0;">
      <li><a href="index.html" data-nav-key="dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>工作台</span></a></li>
      <li><a href="ai-employees.html" data-nav-key="ai-employees" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>AI员工</span></a></li>
      <li><a href="news-hub.html" data-nav-key="news-hub" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg><span>资讯台</span></a></li>
      <!-- AI Chat -->
      <li><a href="chat.html" data-nav-key="chat" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>AI对话</span></a></li>
      <li><a href="creative-studio.html" data-nav-key="creative-studio" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg><span>创作工坊</span></a></li>
      <li><a href="projects.html" data-nav-key="projects" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg><span>项目中心</span></a></li>
      <li><a href="resources.html" data-nav-key="resources" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg><span>资源库</span></a></li>
      <li><a href="settings.html" data-nav-key="settings" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></a></li>
    </ul>
  </nav>
  <div class="px-4 py-4 border-t" style="border-color: var(--border-default);">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center flex-shrink-0 text-xs font-semibold" style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading);">U</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium truncate" style="font-family: var(--font-heading); color: var(--text-heading);">创作者</p>
        <p class="text-xs truncate" style="color: var(--text-muted);">专业版</p>
      </div>
    </div>
  </div>
</aside>

<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">
  <header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6 border-b gap-3" style="background-color: var(--surface-card); border-color: var(--border-default);">
    <div class="flex items-center gap-3 min-w-0">
      <button id="menu-toggle" class="menu-toggle items-center justify-center p-2 rounded-md" style="color: var(--text-secondary); display:none;" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="header-page-title text-lg font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">创作工坊</h1>
    </div>
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" data-role="search" placeholder="搜索创作..." class="w-full pl-9 pr-4 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
      </div>
    </div>
    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题"><svg data-theme-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg data-theme-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg></button>
      <div class="relative">
        <button id="notif-btn" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="通知"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="absolute top-1.5 right-1.5" style="width: 7px; height: 7px; background-color: var(--color-primary); border-radius: var(--radius-full);"></span></button>
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--color-primary);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">创作任务完成</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">图像已生成 · 刚刚</p></div></div>
        </div>
      </div>
      <button class="flex items-center justify-center flex-shrink-0" style="width: 34px; height: 34px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 13px; font-weight: 600; transition: background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--color-primary)'; this.style.color='var(--text-inverse)'" onmouseout="this.style.backgroundColor='var(--color-primary-light)'; this.style.color='var(--color-primary)'" aria-label="用户菜单">U</button>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto" style="background-color: var(--surface-bg);">
    <div class="p-4 sm:p-6 lg:p-8">

      <!-- Tab Navigation -->
      <div class="flex gap-2 mb-6" style="border-bottom: 1px solid var(--border-default);">
        <button class="tab-btn active px-4 py-2.5 text-sm font-medium rounded-t-md" style="font-family: var(--font-heading);" data-tab="image-gen" onclick="switchTab('image-gen')">
          <span class="flex items-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            图像生成
          </span>
        </button>
        <button class="tab-btn px-4 py-2.5 text-sm font-medium rounded-t-md" style="font-family: var(--font-heading); color: var(--text-secondary);" data-tab="video-gen" onclick="switchTab('video-gen')">
          <span class="flex items-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            视频生成
          </span>
        </button>
        <button class="tab-btn px-4 py-2.5 text-sm font-medium rounded-t-md" style="font-family: var(--font-heading); color: var(--text-secondary);" data-tab="history" onclick="switchTab('history')">
          <span class="flex items-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            历史记录
          </span>
        </button>
      </div>

      <!-- Tab Content: 图像生成 -->
      <div id="tab-image-gen" class="tab-content active">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- 输入区 -->
          <div class="rounded-lg p-6" style="background-color: var(--surface-card); border: 1px solid var(--border-default);">
            <h3 class="text-base font-semibold mb-4" style="font-family: var(--font-heading); color: var(--text-heading);">图像生成设置</h3>

            <!-- 模型选择 -->
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">选择模型</label>
              <select id="image-model" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--border-default)'">
                <option value="flux">Flux - 高质量图像生成</option>
                <option value="midjourney">Midjourney - 艺术风格</option>
                <option value="dall-e-3">DALL-E 3 - OpenAI</option>
                <option value="jimeng">即梦 - 中文优化</option>
              </select>
            </div>

            <!-- Prompt 输入 -->
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">提示词 (Prompt)</label>
              <textarea id="image-prompt" rows="5" placeholder="描述你想要生成的图像，例如：一只可爱的橘猫在阳光下打盹，柔和的光线，油画风格" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150 resize-none" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--border-default)'"></textarea>
            </div>

            <!-- 尺寸选择 -->
            <div class="mb-6">
              <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">图像尺寸</label>
              <select id="image-size" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--border-default)'">
                <option value="1024x1024">1024 × 1024 (正方形)</option>
                <option value="1024x768">1024 × 768 (横版)</option>
                <option value="768x1024">768 × 1024 (竖版)</option>
                <option value="1920x1080">1920 × 1080 (宽屏)</option>
              </select>
            </div>

            <!-- 生成按钮 -->
            <button id="image-gen-btn" onclick="generateImage()" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg text-sm font-semibold transition-all duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: white; border: none;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              <span id="image-btn-text">生成图像</span>
            </button>
          </div>

          <!-- 结果展示区 -->
          <div class="rounded-lg p-6" style="background-color: var(--surface-card); border: 1px solid var(--border-default);">
            <h3 class="text-base font-semibold mb-4" style="font-family: var(--font-heading); color: var(--text-heading);">生成结果</h3>
            <div id="image-result" class="flex flex-col items-center justify-center min-h-[300px]" style="background-color: var(--surface-inset); border-radius: var(--radius-md);">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); opacity: 0.5;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <p class="text-sm mt-3" style="color: var(--text-muted);">生成的图像将显示在这里</p>
            </div>
            <div id="image-actions" class="mt-4 hidden">
              <button onclick="downloadImage()" class="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-heading); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='var(--surface-inset)'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                下载图像
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab Content: 视频生成 -->
      <div id="tab-video-gen" class="tab-content">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- 输入区 -->
          <div class="rounded-lg p-6" style="background-color: var(--surface-card); border: 1px solid var(--border-default);">
            <h3 class="text-base font-semibold mb-4" style="font-family: var(--font-heading); color: var(--text-heading);">视频生成设置</h3>

            <!-- 模型选择 -->
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">选择模型</label>
              <select id="video-model" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--border-default)'">
                <option value="vidu">Vidu - 高质量视频</option>
                <option value="sora">Sora - OpenAI</option>
                <option value="runway">Runway Gen-3</option>
                <option value="keling">可灵 - 快手</option>
              </select>
            </div>

            <!-- Prompt 输入 -->
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">提示词 (Prompt)</label>
              <textarea id="video-prompt" rows="4" placeholder="描述你想要生成的视频，例如：一只猫在草地上奔跑，阳光明媚，慢动作镜头" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150 resize-none" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--border-default)'"></textarea>
            </div>

            <!-- 参考图片上传 -->
            <div class="mb-4">
              <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">参考图片 (可选)</label>
              <div id="video-ref-upload" class="relative w-full border-2 border-dashed rounded-md cursor-pointer transition-colors duration-150" style="border-color: var(--border-default); background-color: var(--surface-inset); min-height: 100px;" onclick="document.getElementById('video-ref-input').click()">
                <input type="file" id="video-ref-input" accept="image/*" class="hidden" onchange="handleVideoRefUpload(this)">
                <div id="video-ref-placeholder" class="flex flex-col items-center justify-center py-6">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <p class="text-xs mt-2" style="color: var(--text-muted);">点击上传参考图片</p>
                </div>
                <img id="video-ref-preview" class="hidden w-full h-auto max-h-32 object-contain rounded-md" style="margin: 8px;">
              </div>
            </div>

            <!-- 视频参数 -->
            <div class="grid grid-cols-2 gap-4 mb-6">
              <div>
                <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">时长</label>
                <select id="video-duration" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--border-default)'">
                  <option value="4">4 秒</option>
                  <option value="5" selected>5 秒</option>
                  <option value="10">10 秒</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">比例</label>
                <select id="video-ratio" class="w-full px-3 py-2.5 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--border-default)'">
                  <option value="16:9" selected>16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="1:1">1:1</option>
                </select>
              </div>
            </div>

            <!-- 生成按钮 -->
            <button id="video-gen-btn" onclick="generateVideo()" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 rounded-lg text-sm font-semibold transition-all duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: white; border: none;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span id="video-btn-text">生成视频</span>
            </button>
          </div>

          <!-- 结果展示区 -->
          <div class="rounded-lg p-6" style="background-color: var(--surface-card); border: 1px solid var(--border-default);">
            <h3 class="text-base font-semibold mb-4" style="font-family: var(--font-heading); color: var(--text-heading);">生成结果</h3>
            <div id="video-result" class="flex flex-col items-center justify-center min-h-[300px]" style="background-color: var(--surface-inset); border-radius: var(--radius-md);">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); opacity: 0.5;"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              <p class="text-sm mt-3" style="color: var(--text-muted);">生成的视频将显示在这里</p>
            </div>
            <div id="video-actions" class="mt-4 hidden">
              <button onclick="downloadVideo()" class="inline-flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-heading); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='var(--surface-inset)'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                下载视频
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab Content: 历史记录 -->
      <div id="tab-history" class="tab-content">
        <div class="rounded-lg p-6" style="background-color: var(--surface-card); border: 1px solid var(--border-default);">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">生成历史</h3>
            <div class="flex gap-2">
              <button id="filter-images" onclick="filterHistory('image')" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: white;">图像</button>
              <button id="filter-videos" onclick="filterHistory('video')" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-secondary); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='var(--surface-inset)'">视频</button>
              <button id="filter-all" onclick="filterHistory('all')" class="px-3 py-1.5 text-xs font-medium rounded-md transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-secondary); border: 1px solid var(--border-default);" onmouseover="this.style.backgroundColor='var(--surface-hover)'" onmouseout="this.style.backgroundColor='var(--surface-inset)'">全部</button>
            </div>
          </div>

          <div id="history-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- 动态加载历史记录 -->
          </div>

          <div id="history-empty" class="hidden flex flex-col items-center justify-center py-16">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); opacity: 0.4;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <p class="text-sm mt-4" style="color: var(--text-muted);">暂无生成记录</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/ai.js"></script>
<script>
// ===== Tab 切换 =====
function switchTab(tabName) {
  // 更新 Tab 按钮状态
  document.querySelectorAll('.tab-btn').forEach(btn => {
    if (btn.dataset.tab === tabName) {
      btn.classList.add('active');
      btn.style.backgroundColor = 'var(--color-primary)';
      btn.style.color = 'white';
    } else {
      btn.classList.remove('active');
      btn.style.backgroundColor = 'transparent';
      btn.style.color = 'var(--text-secondary)';
    }
  });

  // 更新 Tab 内容显示
  document.querySelectorAll('.tab-content').forEach(content => {
    content.classList.remove('active');
  });
  document.getElementById(`tab-${tabName}`).classList.add('active');

  // 切换到历史记录时加载数据
  if (tabName === 'history') {
    loadHistory();
  }
}

// ===== 图像生成 =====
let currentImageUrl = null;

async function generateImage() {
  const model = document.getElementById('image-model').value;
  const prompt = document.getElementById('image-prompt').value.trim();
  const size = document.getElementById('image-size').value;

  if (!prompt) {
    alert('请输入提示词');
    return;
  }

  const btn = document.getElementById('image-gen-btn');
  const btnText = document.getElementById('image-btn-text');
  const resultDiv = document.getElementById('image-result');

  // 显示加载状态
  btn.disabled = true;
  btn.classList.add('generating');
  btnText.textContent = '生成中...';
  resultDiv.innerHTML = `
    <div class="flex flex-col items-center">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2" style="border-color: var(--color-primary);"></div>
      <p class="text-sm mt-3" style="color: var(--text-muted);">正在生成图像...</p>
    </div>
  `;

  try {
    // 检查 AI 配置
    if (!ai.isConfigured()) {
      throw new Error('请先在设置页面配置 API Key');
    }

    // 调用 AI 生成图像
    const imageUrl = await ai.generateImage(prompt, model, { size });

    // 保存到数据库
    await ai.saveAsset('image', prompt, imageUrl, model);

    // 显示结果
    currentImageUrl = imageUrl;
    resultDiv.innerHTML = `
      <img src="${imageUrl}" alt="生成的图像" class="max-w-full max-h-[400px] object-contain rounded-md" style="border-radius: var(--radius-md);">
    `;
    document.getElementById('image-actions').classList.remove('hidden');

  } catch (error) {
    console.error('Image generation failed:', error);
    resultDiv.innerHTML = `
      <div class="flex flex-col items-center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--state-error);"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <p class="text-sm mt-3" style="color: var(--state-error);">生成失败: ${error.message}</p>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.classList.remove('generating');
    btnText.textContent = '生成图像';
  }
}

function downloadImage() {
  if (!currentImageUrl) return;
  const link = document.createElement('a');
  link.href = currentImageUrl;
  link.download = `ai-image-${Date.now()}.png`;
  link.click();
}

// ===== 视频生成 =====
let currentVideoUrl = null;
let videoRefImage = null;

function handleVideoRefUpload(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      videoRefImage = e.target.result;
      document.getElementById('video-ref-preview').src = videoRefImage;
      document.getElementById('video-ref-preview').classList.remove('hidden');
      document.getElementById('video-ref-placeholder').classList.add('hidden');
    };
    reader.readAsDataURL(input.files[0]);
  }
}

async function generateVideo() {
  const model = document.getElementById('video-model').value;
  const prompt = document.getElementById('video-prompt').value.trim();
  const duration = parseInt(document.getElementById('video-duration').value);
  const ratio = document.getElementById('video-ratio').value;

  if (!prompt) {
    alert('请输入提示词');
    return;
  }

  const btn = document.getElementById('video-gen-btn');
  const btnText = document.getElementById('video-btn-text');
  const resultDiv = document.getElementById('video-result');

  // 显示加载状态
  btn.disabled = true;
  btn.classList.add('generating');
  btnText.textContent = '生成中...';
  resultDiv.innerHTML = `
    <div class="flex flex-col items-center">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2" style="border-color: var(--color-primary);"></div>
      <p class="text-sm mt-3" style="color: var(--text-muted);">正在生成视频，请稍候...</p>
      <p class="text-xs mt-1" style="color: var(--text-muted);">视频生成通常需要较长时间</p>
    </div>
  `;

  try {
    // 检查 AI 配置
    if (!ai.isConfigured()) {
      throw new Error('请先在设置页面配置 API Key');
    }

    // 调用 AI 生成视频
    const result = await ai.generateVideo(prompt, model, {
      duration,
      aspect_ratio: ratio,
      reference_image: videoRefImage
    });

    // 获取视频 URL（不同 API 返回格式可能不同）
    const videoUrl = result.url || result.video_url || result.data?.[0]?.url;

    if (!videoUrl) {
      throw new Error('未能获取视频地址，请稍后重试');
    }

    // 保存到数据库
    await ai.saveAsset('video', prompt, videoUrl, model);

    // 显示结果
    currentVideoUrl = videoUrl;
    resultDiv.innerHTML = `
      <video controls class="max-w-full max-h-[400px] rounded-md" style="border-radius: var(--radius-md);">
        <source src="${videoUrl}" type="video/mp4">
        您的浏览器不支持视频播放
      </video>
    `;
    document.getElementById('video-actions').classList.remove('hidden');

  } catch (error) {
    console.error('Video generation failed:', error);
    resultDiv.innerHTML = `
      <div class="flex flex-col items-center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="color: var(--state-error);"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <p class="text-sm mt-3" style="color: var(--state-error);">生成失败: ${error.message}</p>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.classList.remove('generating');
    btnText.textContent = '生成视频';
  }
}

function downloadVideo() {
  if (!currentVideoUrl) return;
  const link = document.createElement('a');
  link.href = currentVideoUrl;
  link.download = `ai-video-${Date.now()}.mp4`;
  link.click();
}

// ===== 历史记录 =====
let currentFilter = 'image';

async function loadHistory() {
  const listDiv = document.getElementById('history-list');
  const emptyDiv = document.getElementById('history-empty');

  listDiv.innerHTML = `
    <div class="col-span-full flex items-center justify-center py-8">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2" style="border-color: var(--color-primary);"></div>
    </div>
  `;

  try {
    let assets = [];

    // 检查数据库是否可用
    if (typeof db !== 'undefined' && db.getAssets) {
      if (currentFilter === 'all') {
        const images = await db.getAssets({ type: 'image' }) || [];
        const videos = await db.getAssets({ type: 'video' }) || [];
        assets = [...images, ...videos].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      } else {
        assets = await db.getAssets({ type: currentFilter }) || [];
      }
    }

    if (assets.length === 0) {
      listDiv.innerHTML = '';
      emptyDiv.classList.remove('hidden');
      emptyDiv.classList.add('flex');
      return;
    }

    emptyDiv.classList.add('hidden');
    emptyDiv.classList.remove('flex');

    listDiv.innerHTML = assets.map(asset => {
      const isImage = asset.type === 'image';
      const time = new Date(asset.created_at).toLocaleString('zh-CN');
      const promptPreview = asset.prompt?.length > 50 ? asset.prompt.substring(0, 50) + '...' : asset.prompt || '无提示词';

      return `
        <div class="rounded-lg overflow-hidden cursor-pointer transition-all duration-150" style="background-color: var(--surface-inset); border: 1px solid var(--border-default);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'" onclick="viewAsset('${asset.id}', '${asset.type}')">
          <div class="aspect-square overflow-hidden" style="background-color: var(--surface-bg);">
            ${isImage
              ? `<img src="${asset.result_url}" alt="${promptPreview}" class="w-full h-full object-cover">`
              : `<video class="w-full h-full object-cover"><source src="${asset.result_url}" type="video/mp4"></video>`
            }
          </div>
          <div class="p-3">
            <div class="flex items-center gap-1.5 mb-1.5">
              ${isImage
                ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`
                : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-primary);"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`
              }
              <span class="text-xs font-medium" style="font-family: var(--font-heading); color: var(--text-heading);">${asset.model || 'Unknown'}</span>
            </div>
            <p class="text-xs truncate mb-2" style="color: var(--text-secondary);">${promptPreview}</p>
            <p class="text-xs" style="color: var(--text-muted);">${time}</p>
          </div>
        </div>
      `;
    }).join('');

  } catch (error) {
    console.error('Failed to load history:', error);
    listDiv.innerHTML = '';
    emptyDiv.classList.remove('hidden');
    emptyDiv.classList.add('flex');
  }
}

function filterHistory(type) {
  currentFilter = type;

  // 更新按钮样式
  ['filter-images', 'filter-videos', 'filter-all'].forEach(id => {
    const btn = document.getElementById(id);
    if ((id === 'filter-images' && type === 'image') ||
        (id === 'filter-videos' && type === 'video') ||
        (id === 'filter-all' && type === 'all')) {
      btn.style.backgroundColor = 'var(--color-primary)';
      btn.style.color = 'white';
      btn.style.border = 'none';
    } else {
      btn.style.backgroundColor = 'var(--surface-inset)';
      btn.style.color = 'var(--text-secondary)';
      btn.style.border = '1px solid var(--border-default)';
    }
  });

  loadHistory();
}

function viewAsset(id, type) {
  // 在新窗口打开资源
  const assets = document.querySelectorAll('#history-list > div');
  // 简单处理：点击项目时下载
  // 实际可以跳转到详情页
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', function() {
  // 初始化 Tab 样式
  document.querySelectorAll('.tab-btn').forEach(btn => {
    if (btn.classList.contains('active')) {
      btn.style.backgroundColor = 'var(--color-primary)';
      btn.style.color = 'white';
    } else {
      btn.style.backgroundColor = 'transparent';
      btn.style.color = 'var(--text-secondary)';
    }
  });
});
</script>
</body>
</html>
