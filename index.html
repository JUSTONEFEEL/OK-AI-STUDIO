<!DOCTYPE html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>工作台 — OK AI ART</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-primary: var(--color-primary);
      --color-secondary: var(--color-secondary);
    }
    @layer base {
      body { background: var(--surface-bg); color: var(--text-body); }
      td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
      th { @apply whitespace-nowrap; }
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased" data-page="dashboard" style="font-family: var(--font-body); color: var(--text-body); background-color: var(--surface-bg);">

<!-- Mobile drawer backdrop -->
<div id="app-backdrop" class="app-backdrop"></div>

<!-- ===== LEFT SIDEBAR ===== -->
<aside id="app-sidebar"
  class="app-sidebar fixed top-0 left-0 z-30 flex flex-col h-screen border-r"
  style="width: var(--sidebar-width); background-color: var(--surface-inset); border-color: var(--border-default);">
  <!-- Sidebar Logo / Brand -->
  <div class="flex items-center gap-3 px-5 h-16 border-b" style="border-color: var(--border-default);">
    <div class="flex items-center justify-center flex-shrink-0"
      style="width: 32px; height: 32px; background-color: var(--color-primary); border-radius: var(--radius-md);">
      <img src="assets/logo.svg" alt="OK AI ART" style="width: 20px; height: 20px;" />
    </div>
    <span class="text-sm font-semibold tracking-tight" style="font-family: var(--font-heading); color: var(--text-heading);">OK AI ART</span>
  </div>

  <!-- Sidebar Navigation -->
  <nav class="flex-1 overflow-y-auto py-4 px-3">
    <ul class="flex flex-col gap-1" style="list-style: none; margin: 0; padding: 0;">
      <li>
        <a href="index.html" data-nav-key="dashboard"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>工作台</span>
        </a>
      </li>
      <li>
        <a href="ai-employees.html" data-nav-key="ai-employees"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>AI员工</span>
        </a>
      </li>
      <li>
        <a href="news-hub.html" data-nav-key="news-hub"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
          <span>资讯台</span>
        </a>
      </li>
      <!-- AI Chat -->
      <li>
        <a href="chat.html" data-nav-key="chat"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>AI对话</span>
        </a>
      </li>
      <li>
        <a href="creative-studio.html" data-nav-key="creative-studio"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
          <span>创作工坊</span>
        </a>
      </li>
      <li>
        <a href="projects.html" data-nav-key="projects"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg>
          <span>项目中心</span>
        </a>
      </li>
      <li>
        <a href="resources.html" data-nav-key="resources"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
          <span>资源库</span>
        </a>
      </li>
      <li>
        <a href="settings.html" data-nav-key="settings"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150"
          style="font-family: var(--font-heading); color: var(--text-secondary);"
          onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'"
          onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>设置</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sidebar Footer -->
  <div class="px-4 py-4 border-t" style="border-color: var(--border-default);">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center flex-shrink-0 text-xs font-semibold"
        style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading);">U</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium truncate" style="font-family: var(--font-heading); color: var(--text-heading);">创作者</p>
        <p class="text-xs truncate" style="color: var(--text-muted);">专业版</p>
      </div>
    </div>
  </div>
</aside>

<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">

  <!-- ===== TOP HEADER BAR ===== -->
  <header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6 border-b gap-3"
    style="background-color: var(--surface-card); border-color: var(--border-default);">
    <!-- Header Left: hamburger (mobile) + Page Title -->
    <div class="flex items-center gap-3 min-w-0">
      <button id="menu-toggle" class="menu-toggle items-center justify-center p-2 rounded-md" style="color: var(--text-secondary); display:none;" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="header-page-title text-lg font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">工作台</h1>
    </div>

    <!-- Header Center: Search -->
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" data-role="search" placeholder="搜索项目、AI员工、资源..."
          class="w-full pl-9 pr-4 py-2 text-sm rounded-md outline-none transition-colors duration-150"
          style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);"
          onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'"
          onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
      </div>
    </div>

    <!-- Header Right: theme toggle + notifications + avatar -->
    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题">
        <svg data-theme-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg data-theme-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
      </button>
      <div class="relative">
        <button id="notif-btn" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="通知">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="absolute top-1.5 right-1.5" style="width: 7px; height: 7px; background-color: var(--color-primary); border-radius: var(--radius-full);"></span>
        </button>
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-item" style="justify-content: center; padding: 16px;">
            <p class="text-sm" style="font-family: var(--font-heading); color: var(--text-muted);">加载中...</p>
          </div>
        </div>
      </div>
      <button class="flex items-center justify-center flex-shrink-0" style="width: 34px; height: 34px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 13px; font-weight: 600; transition: background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--color-primary)'; this.style.color='var(--text-inverse)'" onmouseout="this.style.backgroundColor='var(--color-primary-light)'; this.style.color='var(--color-primary)'" aria-label="用户菜单">U</button>
    </div>
  </header>

  <!-- ===== PAGE CONTENT AREA ===== -->
  <main class="flex-1 overflow-y-auto" style="background-color: var(--surface-bg);">

    <!-- ===== WELCOME BANNER ===== -->
    <section class="relative overflow-hidden" style="margin: 24px 24px 0 24px; border-radius: var(--radius-xl); min-height: 200px;">
      <img src="assets/image_0_yi19x4.jpg" alt="AI创意工作台欢迎横幅" class="absolute inset-0 w-full h-full object-cover" style="border-radius: var(--radius-xl);" />
      <div class="absolute inset-0" style="background: linear-gradient(135deg, rgba(20, 20, 19, 0.55) 0%, rgba(217, 119, 87, 0.25) 100%); border-radius: var(--radius-xl);"></div>
      <div class="relative z-10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 px-6 sm:px-10 py-8 sm:py-10" style="min-height: 200px;">
        <div>
          <h2 class="text-2xl sm:text-3xl font-bold text-white mb-2" style="font-family: var(--font-heading); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">早上好，创作者</h2>
          <p id="welcome-subtitle" class="text-sm sm:text-base text-white opacity-80 max-w-md" style="font-family: var(--font-body);">准备好开始今天的创作了吗？</p>
        </div>
        <div class="flex gap-3 self-start sm:self-auto">
          <a href="creative-studio.html" class="inline-flex items-center justify-center px-6 py-3 rounded-lg text-sm font-semibold whitespace-nowrap transition-all duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border-radius: var(--radius-md);" onmouseover="this.style.backgroundColor='var(--color-primary-hover)'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='var(--color-primary)'; this.style.transform='translateY(0)'" onmousedown="this.style.transform='translateY(0)'">开始创作</a>
          <a href="projects.html" class="inline-flex items-center justify-center px-6 py-3 rounded-lg text-sm font-semibold whitespace-nowrap transition-all duration-150" style="font-family: var(--font-heading); background-color: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: var(--radius-md);" onmouseover="this.style.backgroundColor='rgba(255,255,255,0.25)'" onmouseout="this.style.backgroundColor='rgba(255,255,255,0.15)'">查看项目</a>
        </div>
      </div>
    </section>

    <!-- ===== STATS ROW ===== -->
    <section id="stats-section" class="grid grid-cols-2 lg:grid-cols-4 gap-4" style="margin: 24px 24px 0 24px;">
      <div id="stat-employees" class="flex flex-col p-5 border transition-colors duration-150 cursor-pointer" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
        <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">AI员工数</span>
        <span class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
      </div>
      <div id="stat-projects" class="flex flex-col p-5 border transition-colors duration-150 cursor-pointer" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
        <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">进行中项目</span>
        <span class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
      </div>
      <div id="stat-assets" class="flex flex-col p-5 border transition-colors duration-150 cursor-pointer" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
        <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">生成资源</span>
        <span class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
      </div>
      <div id="stat-conversations" class="flex flex-col p-5 border transition-colors duration-150 cursor-pointer" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);" onmouseover="this.style.borderColor='var(--color-primary)'" onmouseout="this.style.borderColor='var(--border-default)'">
        <span class="text-sm mb-1" style="font-family: var(--font-heading); color: var(--text-secondary);">对话次数</span>
        <span class="text-3xl font-bold whitespace-nowrap" style="font-family: var(--font-heading); color: var(--text-heading); font-variant-numeric: tabular-nums;">0</span>
      </div>
    </section>

    <!-- ===== TWO-COLUMN LAYOUT ===== -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6" style="margin: 24px 24px 32px 24px;">

      <!-- LEFT COLUMN: 最近项目 -->
      <div class="lg:col-span-2">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">最近项目</h3>
          <a href="projects.html" class="text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-link);" onmouseover="this.style.color='var(--color-primary-hover)'" onmouseout="this.style.color='var(--text-link)'">查看全部</a>
        </div>

        <div id="recent-projects" class="flex flex-col gap-4">
          <div class="flex flex-col items-center justify-center p-8 border" style="background-color: var(--surface-card); border-color: var(--border-default); border-radius: var(--radius-md);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-bottom: 16px;"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg>
            <p class="text-sm mb-4" style="font-family: var(--font-heading); color: var(--text-muted);">加载中...</p>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="flex flex-col gap-6">

        <!-- AI员工状态 -->
        <div>
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">AI员工状态</h3>
            <a href="ai-employees.html" class="text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-link);" onmouseover="this.style.color='var(--color-primary-hover)'" onmouseout="this.style.color='var(--text-link)'">管理</a>
