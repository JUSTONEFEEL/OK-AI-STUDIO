<!DOCTYPE html>

  <link rel="stylesheet" href="assets/css/theme.css">

</head>
<body class="min-h-screen font-sans antialiased" data-page="ai-employees" style="font-family: var(--font-body); color: var(--text-body); background-color: var(--surface-bg);">

<div id="app-backdrop" class="app-backdrop"></div>

<!-- ===== LEFT SIDEBAR ===== -->

      <img src="assets/logo.svg" alt="OK AI ART" style="width: 20px; height: 20px;" />
    </div>
    <span class="text-sm font-semibold tracking-tight" style="font-family: var(--font-heading); color: var(--text-heading);">OK AI ART</span>

  <nav class="flex-1 overflow-y-auto py-4 px-3">

      <li><a href="index.html" data-nav-key="dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>工作台</span></a></li>
      <li><a href="ai-employees.html" data-nav-key="ai-employees" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>AI员工</span></a></li>
      <li><a href="news-hub.html" data-nav-key="news-hub" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg><span>资讯台</span></a></li>
      <!-- AI Chat -->
      <li><a href="chat.html" data-nav-key="chat" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>AI对话</span></a></li>
      <li><a href="creative-studio.html" data-nav-key="creative-studio" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg><span>创作工坊</span></a></li>
      <li><a href="projects.html" data-nav-key="projects" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h16Z"/></svg><span>项目中心</span></a></li>
      <li><a href="resources.html" data-nav-key="resources" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg><span>资源库</span></a></li>
      <li><a href="settings.html" data-nav-key="settings" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-colors duration-150" style="font-family: var(--font-heading); color: var(--text-secondary);" onmouseover="if(!this.hasAttribute('data-active'))this.style.backgroundColor='var(--surface-hover)'" onmouseout="if(!this.hasAttribute('data-active'))this.style.backgroundColor='transparent'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></a></li>
    </ul>
  </nav>
  <div class="px-4 py-4 border-t" style="border-color: var(--border-default);">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center flex-shrink-0 text-xs font-semibold" style="width: 28px; height: 28px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading);">U</div>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-medium truncate" style="font-family: var(--font-heading); color: var(--text-heading);">创作者</p>
        <p class="text-xs truncate" style="color: var(--text-muted);">专业版</p>
      </div>
    </div>
  </div>
</aside>

<!-- ===== MAIN CONTENT WRAPPER ===== -->
<div class="app-main flex flex-col flex-1" style="margin-left: var(--sidebar-width);">
  <header class="sticky top-0 z-20 flex items-center justify-between h-16 px-4 sm:px-6 border-b gap-3" style="background-color: var(--surface-card); border-color: var(--border-default);">
    <div class="flex items-center gap-3 min-w-0">
      <button id="menu-toggle" class="menu-toggle items-center justify-center p-2 rounded-md" style="color: var(--text-secondary); display:none;" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="header-page-title text-lg font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">AI员工</h1>
    </div>
    <div class="header-search flex items-center justify-center flex-1 mx-4 sm:mx-8" style="max-width: 480px;">
      <div class="relative w-full">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" data-role="search" placeholder="搜索AI员工..." class="w-full pl-9 pr-4 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-inset); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
      </div>
    </div>
    <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
      <button id="theme-toggle" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="切换主题"><svg data-theme-icon-moon width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg data-theme-icon-sun width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg></button>
      <div class="relative">
        <button id="notif-btn" class="relative flex items-center justify-center p-2 rounded-md transition-colors duration-150" style="color: var(--text-secondary);" aria-label="通知"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="absolute top-1.5 right-1.5" style="width: 7px; height: 7px; background-color: var(--color-primary); border-radius: var(--radius-full);"></span></button>
        <div id="notif-dropdown" class="notif-dropdown">
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--color-primary);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">新任务分配</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">分镜生成AI 已接受 1 个任务 · 5 分钟前</p></div></div>
          <div class="notif-item"><div style="width:8px;height:8px;border-radius:9999px;background:var(--state-success);margin-top:6px;flex-shrink:0;"></div><div><p class="text-sm font-medium" style="font-family:var(--font-heading);color:var(--text-heading);">配音合成AI 离线</p><p class="text-xs mt-0.5" style="color:var(--text-muted);">请检查 API 密钥配置 · 1 小时前</p></div></div>
        </div>
      </div>
      <button class="flex items-center justify-center flex-shrink-0" style="width: 34px; height: 34px; background-color: var(--color-primary-light); color: var(--color-primary); border-radius: var(--radius-full); font-family: var(--font-heading); font-size: 13px; font-weight: 600; transition: background-color 150ms ease;" onmouseover="this.style.backgroundColor='var(--color-primary)'; this.style.color='var(--text-inverse)'" onmouseout="this.style.backgroundColor='var(--color-primary-light)'; this.style.color='var(--color-primary)'" aria-label="用户菜单">U</button>
    </div>
  </header>

  <main class="flex-1" style="background-color: var(--surface-bg);">
    <div class="p-4 sm:p-6 lg:p-8">

      <!-- Top Action Bar -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
          <h2 class="text-2xl font-semibold" style="font-family: var(--font-heading); color: var(--text-heading); text-wrap: balance; word-break: keep-all; overflow-wrap: break-word;">AI员工</h2>
          <p class="mt-1 text-sm" style="font-family: var(--font-body); color: var(--text-secondary);">管理你的AI创作团队</p>
        </div>
        <a href="new-employee.html" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none;" onmouseover="this.style.backgroundColor='var(--color-primary-hover)'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='var(--color-primary)'; this.style.transform='translateY(0)'" onmousedown="this.style.transform='translateY(0)'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          创建AI员工
        </a>
      </div>

      <!-- Filter Bar -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-6">
        <div class="flex items-center gap-1 p-1 rounded-md" style="background-color: var(--surface-inset); border: 1px solid var(--border-default);">
          <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="all" data-active="true" style="font-family: var(--font-heading);">全部</button>
          <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="online" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">在线</button>
          <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="offline" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">离线</button>
          <button class="filter-tab inline-flex items-center justify-center px-3.5 py-1.5 text-sm rounded-md whitespace-nowrap transition-colors duration-150" data-filter="busy" style="font-family: var(--font-heading); color: var(--text-secondary); border: none; background: transparent;">忙碌</button>
        </div>
        <div class="flex-1"></div>
        <div class="relative" style="width: 100%; max-width: 240px;">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="employee-search" type="text" data-role="search" placeholder="搜索员工..." class="w-full pl-8 pr-3 py-2 text-sm rounded-md outline-none transition-colors duration-150" style="font-family: var(--font-body); background-color: var(--surface-card); color: var(--text-body); border: 1px solid var(--border-default);" onfocus="this.style.borderColor='var(--color-primary)'; this.style.boxShadow='0 0 0 2px var(--color-primary-light)'" onblur="this.style.borderColor='var(--border-default)'; this.style.boxShadow='none'" />
        </div>
      </div>

      <!-- AI Employee Grid -->
      <div id="employee-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      </div>

      <!-- Empty state: no employees at all -->
      <div id="empty-state-zero" class="hidden flex-col items-center justify-center py-20 text-center">
        <div class="flex items-center justify-center mb-4" style="width: 72px; height: 72px; background-color: var(--surface-inset); border-radius: var(--radius-full);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <p class="text-base font-semibold" style="font-family: var(--font-heading); color: var(--text-heading);">暂无AI员工</p>
        <p class="text-sm mt-1.5" style="font-family: var(--font-body); color: var(--text-muted);">创建你的第一个AI员工，开始自动化创作</p>
        <a href="new-employee.html" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150 mt-6" style="font-family: var(--font-heading); background-color: var(--color-primary); color: var(--text-inverse); border: none; text-decoration: none;" onmouseover="this.style.backgroundColor='var(--color-primary-hover)'" onmouseout="this.style.backgroundColor='var(--color-primary)'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          创建AI员工
        </a>
      </div>

      <!-- Empty state: no search/filter results -->
      <div id="empty-state-filter" class="hidden flex-col items-center justify-center py-16 text-center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-bottom: 12px;"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <p class="text-sm font-medium" style="font-family: var(--font-heading); color: var(--text-heading);">没有匹配的AI员工</p>
        <p class="text-xs mt-1" style="font-family: var(--font-body); color: var(--text-muted);">试试切换筛选条件或修改搜索关键词</p>
      </div>

      <!-- Delete Confirmation Modal -->
      <div id="delete-modal" class="fixed inset-0 z-50 hidden items-center justify-center" style="background-color: rgba(0,0,0,0.5);">
        <div class="rounded-lg mx-4" style="background-color: var(--surface-card); border: 1px solid var(--border-default); padding: 24px; max-width: 400px; width: 100%;">
          <h3 class="text-lg font-semibold mb-2" style="font-family: var(--font-heading); color: var(--text-heading);">确认删除</h3>
          <p class="text-sm mb-6" style="font-family: var(--font-body); color: var(--text-secondary);">确定要删除 <span id="delete-employee-name" class="font-medium" style="color: var(--text-heading);"></span> 吗？此操作无法撤销。</p>
          <div class="flex items-center justify-end gap-3">
            <button id="delete-cancel" class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-secondary); border: 1px solid var(--border-default);" onmouseover="this.style.borderColor='var(--border-strong)'; this.style.color='var(--text-heading)'" onmouseout="this.style.borderColor='var(--border-default)'; this.style.color='var(--text-secondary)'">取消</button>
            <button id="delete-confirm" class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold rounded-md whitespace-nowrap transition-colors duration-150" style="font-family: var(--font-heading); background-color: var(--state-error); color: #fff; border: none;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">删除</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
<script>
  (function () {
    var tabs = document.querySelectorAll('.filter-tab');
    var grid = document.getElementById('employee-grid');
    var searchInput = document.getElementById('employee-search');
    var emptyStateZero = document.getElementById('empty-state-zero');
    var emptyStateFilter = document.getElementById('empty-state-filter');
    var deleteModal = document.getElementById('delete-modal');
    var deleteEmployeeName = document.getElementById('delete-employee-name');
    var deleteCancelBtn = document.getElementById('delete-cancel');
    var deleteConfirmBtn = document.getElementById('delete-confirm');
    var currentFilter = 'all';
    var employees = [];
    var pendingDeleteId = null;

    var statusMap = {
      'active': 'online',
      'online': 'online',
      'busy': 'busy',
      'offline': 'offline',
      'inactive': 'offline'
    };

    var statusColors = {
      online: 'var(--state-success)',
      busy: 'var(--state-warning)',
      offline: 'var(--text-muted)'
    };

    var statusLabels = {
      online: '在线',
      busy: '忙碌',
      offline: '离线'
    };

    var roleDisplayMap = {
      'director': '导演',
      'design': '设计',
      'generate': '生成',
      'screenwriter': '编剧',
      'audio': '音频',
      'vfx': '特效',
      'custom': '自定义'
    };

    var roleColors = {
      '导演': '#d97757', '视频创作': '#d97757',
      '设计': '#8b5cf6', '角色设计': '#8b5cf6',
      '分镜设计': '#3b82f6', '剧本创作': '#22c55e', '编剧': '#22c55e',
      '配音制作': '#f59e0b', '音频': '#f59e0b', '制作': '#f59e0b',
      '后期制作': '#ec4899', '特效': '#ec4899', '生成': '#3b82f6'
    };

    function getDisplayRole(role) {
      if (!role) return 'AI员工';
      return roleDisplayMap[role] || role;
    }

    function getNormalizedStatus(status) {
      if (!status) return 'offline';
      return statusMap[status] || 'offline';
    }

    function getRoleColor(role) {
      var displayRole = getDisplayRole(role);
      for (var key in roleColors) {
        if (displayRole.indexOf(key) !== -1) return roleColors[key];
      }
      return 'var(--color-primary)';
    }

    function showEmptyState(type) {
      if (!grid || !emptyStateZero || !emptyStateFilter) return;
      grid.classList.add('hidden');
      if (type === 'zero') {
        emptyStateZero.classList.remove('hidden');
        emptyStateZero.classList.add('flex');
        emptyStateFilter.classList.add('hidden');
        emptyStateFilter.classList.remove('flex');
      } else {
        emptyStateZero.classList.add('hidden');
        emptyStateZero.classList.remove('flex');
        emptyStateFilter.classList.remove('hidden');
        emptyStateFilter.classList.add('flex');
      }
    }

    function hideEmptyStates() {
      if (!grid || !emptyStateZero || !emptyStateFilter) return;
      grid.classList.remove('hidden');
      emptyStateZero.classList.add('hidden');
      emptyStateZero.classList.remove('flex');
      emptyStateFilter.classList.add('hidden');
      emptyStateFilter.classList.remove('flex');
    }

    function openDeleteModal(id, name) {
      pendingDeleteId = id;
      if (deleteEmployeeName) deleteEmployeeName.textContent = name;
      if (deleteModal) {
        deleteModal.classList.remove('hidden');
        deleteModal.classList.add('flex');
      }
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      if (deleteModal) {
        deleteModal.classList.add('hidden');
        deleteModal.classList.remove('flex');
      }
    }

    function confirmDelete() {
      if (!pendingDeleteId || typeof db === 'undefined') {
        closeDeleteModal();
        return;
      }
      var id = pendingDeleteId;
      if (deleteConfirmBtn) {
        deleteConfirmBtn.disabled = true;
        deleteConfirmBtn.textContent = '删除中...';
      }
      db.deleteEmployee(id)
        .then(function () {
          window.awShowToast && window.awShowToast('删除成功');
          closeDeleteModal();
          loadEmployees();
        })
        .catch(function (err) {
          console.error('Delete employee error:', err);
          window.awShowToast && window.awShowToast('删除失败：' + (err.message || '网络错误'));
          closeDeleteModal();
        })
        .finally(function () {
          if (deleteConfirmBtn) {
            deleteConfirmBtn.disabled = false;
            deleteConfirmBtn.textContent = '删除';
          }
        });
    }

    function renderCards(list) {
      if (!grid) return;
      grid.innerHTML = '';
      list.forEach(function (emp) {
        var role = emp.role || '';
        var color = getRoleColor(role);
        var displayRole = getDisplayRole(role);
        var normalizedStatus = getNormalizedStatus(emp.status);
        var statusColor = statusColors[normalizedStatus];
        var opacity = normalizedStatus === 'offline' ? 'opacity: 0.7;' : '';
        var card = document.createElement('div');
        card.className = 'employee-card rounded-lg transition-all duration-200';
        card.setAttribute('data-status', normalizedStatus);
        card.setAttribute('data-name', emp.name);
        card.setAttribute('data-id', emp.id);
        card.style.cssText = 'background-color: var(--surface-card); border: 1px solid var(--border-default); padding: 24px;' + opacity;
        card.onmouseover = function () { this.style.borderColor = 'var(--border-strong)'; this.style.boxShadow = 'var(--shadow-static)'; };
        card.onmouseout = function () { this.style.borderColor = 'var(--border-default)'; this.style.boxShadow = 'none'; };

        var avatarHtml = '';
        if (emp.avatar_url) {
          avatarHtml = '<img src="' + emp.avatar_url + '" alt="' + emp.name + '" style="width: 48px; height: 48px; border-radius: var(--radius-full); object-fit: cover;" />';
        } else {
          avatarHtml = '<div class="flex items-center justify-center" style="width: 48px; height: 48px; background-color: rgba(139, 92, 246, 0.15); border-radius: var(--radius-full);">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' +
          '</div>';
        }

        var skillsHtml = '';
        if (emp.skills && Array.isArray(emp.skills) && emp.skills.length > 0) {
          var skillTags = emp.skills.slice(0, 3).map(function (s) {
            return '<span class="inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md" style="background-color: var(--surface-inset); color: var(--text-muted); font-family: var(--font-body);">' + s + '</span>';
          }).join('');
          skillsHtml = '<div class="flex flex-wrap gap-1.5 mb-4">' + skillTags + '</div>';
        }

        card.innerHTML =
          '<div class="flex items-start gap-4 mb-4">' +
            '<div class="relative flex-shrink-0">' +
              avatarHtml +
              '<span class="absolute -bottom-0.5 -right-0.5" style="width: 12px; height: 12px; background-color: ' + statusColor + '; border: 2px solid var(--surface-card); border-radius: var(--radius-full);" title="' + statusLabels[normalizedStatus] + '"></span>' +
            '</div>' +
            '<div class="flex-1 min-w-0">' +
              '<h3 class="text-base font-semibold truncate" style="font-family: var(--font-heading); color: var(--text-heading);">' + (emp.name || '未命名') + '</h3>' +
              '<div class="flex items-center gap-2 mt-1">' +
                '<span class="inline-flex items-center justify-center px-2 py-0.5 text-xs rounded-md whitespace-nowrap" style="font-family: var(--font-heading); background-color: ' + color + '20; color: ' + color + ';">' + displayRole + '</span>' +
                '<span class="text-xs" style="color: var(--text-muted); font-family: var(--font-body);">' + statusLabels[normalizedStatus] + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
          (emp.description ? '<p class="text-xs mb-4 line-clamp-2" style="font-family: var(--font-body); color: var(--text-muted);">' + emp.description + '</p>' : '') +
          skillsHtml +
          '<div class="flex items-center gap-2 pt-2" style="border-top: 1px solid var(--border-subtle);">' +
            '<button class="edit-btn flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-medium rounded-md whitespace-nowrap transition-colors duration-150" data-id="' + emp.id + '" style="font-family: var(--font-heading); background-color: var(--surface-inset); color: var(--text-secondary); border: 1px solid var(--border-default);" onmouseover="this.style.borderColor=\'var(--border-strong)\'; this.style.color=\'var(--text-heading)\'" onmouseout="this.style.borderColor=\'var(--border-default)\'; this.style.color=\'var(--text-secondary)\'">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>' +
              '编辑' +
            '</button>' +
            '<button class="delete-btn flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-medium rounded-md whitespace-nowrap transition-colors duration-150" data-id="' + emp.id + '" data-name="' + (emp.name || '') + '" style="font-family: var(--font-heading); background-color: rgba(239, 68, 68, 0.1); color: var(--state-error); border: 1px solid rgba(239, 68, 68, 0.2);" onmouseover="this.style.backgroundColor=\'rgba(239, 68, 68, 0.15)\'; this.style.borderColor=\'var(--state-error)\'" onmouseout="this.style.backgroundColor=\'rgba(239, 68, 68, 0.1)\'; this.style.borderColor=\'rgba(239, 68, 68, 0.2)\'">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>' +
              '删除' +
            '</button>' +
          '</div>';
        grid.appendChild(card);
      });

      var editBtns = grid.querySelectorAll('.edit-btn');
      editBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          if (id) {
            window.location.href = 'new-employee.html?id=' + encodeURIComponent(id);
          }
        });
      });

      var deleteBtns = grid.querySelectorAll('.delete-btn');
      deleteBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var name = btn.getAttribute('data-name');
          if (id) {
            openDeleteModal(id, name);
          }
        });
      });

      if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
    }

    function applyFilter() {
      var query = (searchInput && searchInput.value ? searchInput.value : '').trim().toLowerCase();
      var hasFilter = currentFilter !== 'all' || query.length > 0;

      if (employees.length === 0) {
        showEmptyState('zero');
        return;
      }

      var filtered = employees.filter(function (emp) {
        var normalizedStatus = getNormalizedStatus(emp.status);
        var matchFilter = (currentFilter === 'all' || normalizedStatus === currentFilter);
        var matchQuery = (!query || (emp.name || '').toLowerCase().indexOf(query) !== -1);
        return matchFilter && matchQuery;
      });

      if (filtered.length === 0 && hasFilter) {
        showEmptyState('filter');
        return;
      }

      hideEmptyStates();
      renderCards(filtered);
    }

    function loadEmployees() {
      if (typeof db === 'undefined') {
        console.warn('db is not defined');
        applyFilter();
        return;
      }
      db.getEmployees()
        .then(function (data) {
          employees = data || [];
          applyFilter();
        })
        .catch(function (err) {
          console.warn('Failed to load employees from Supabase:', err);
          employees = [];
          applyFilter();
        });
    }

    function setActiveTab(activeTab) {
      tabs.forEach(function (t) {
        t.removeAttribute('data-active');
        t.style.fontWeight = 'normal';
        t.style.color = 'var(--text-secondary)';
        t.style.background = 'transparent';
        t.style.border = 'none';
        t.style.boxShadow = 'none';
      });
      activeTab.setAttribute('data-active', 'true');
      activeTab.style.fontWeight = '600';
      activeTab.style.color = 'var(--text-heading)';
      activeTab.style.backgroundColor = 'var(--surface-card)';
      activeTab.style.boxShadow = '0 1px 2px rgba(0,0,0,0.05)';
    }

    tabs.forEach(function (tab) {
      if (tab.getAttribute('data-active') === 'true') {
        setActiveTab(tab);
      }
      tab.addEventListener('click', function () {
        setActiveTab(tab);
        currentFilter = tab.getAttribute('data-filter');
        applyFilter();
      });
    });

    if (searchInput) {
      searchInput.addEventListener('input', applyFilter);
    }

    if (deleteCancelBtn) {
      deleteCancelBtn.addEventListener('click', closeDeleteModal);
    }

    if (deleteConfirmBtn) {
      deleteConfirmBtn.addEventListener('click', confirmDelete);
    }

    if (deleteModal) {
      deleteModal.addEventListener('click', function (e) {
        if (e.target === deleteModal) {
          closeDeleteModal();
        }
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && deleteModal && !deleteModal.classList.contains('hidden')) {
        closeDeleteModal();
      }
    });

    loadEmployees();
  })();
</script>
</body>
</html>
